<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1420">
<script>try{var t=localStorage.getItem('tema');if(t==='claro')document.documentElement.dataset.theme='light';else if(t==='oscuro')document.documentElement.dataset.theme='dark';}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Recorrido de obra</title>
<style>
/* MiLibroDeObra · marino #0e1420→#16213a, tinta #1a2230, papel #f4f2ed, hueso #f2f0ec, naranja #c06818, ámbar #e0a35c, cobre #9a5312 */
:root{
  --bg:#f4f2ed; --panel:#ffffff; --panel2:#faf7f2; --campo:#ffffff; --chip:#ece6db;
  --ink:#1a2230; --muted:#6b7280; --line:#e3ddd2;
  --headBg:linear-gradient(135deg,#0e1420,#16213a); --headInk:#f2f0ec; --headMuted:#a9b3c7;
  --out:#fbe3c4; --outInk:#1a2230; --outMeta:#8a6a45; --citaBg:rgba(26,34,48,.06);
  --accent:#c06818; --onAccent:#ffffff; --link:#9a5312; --hl:#e0a35c;
  --pend:#d64545; --listo:#2f9e63; --sin:#8090ad; --tocada:#e0a35c; --danger:#d64545;
  --sombra:0 1px 3px rgba(26,34,48,.10); --patron:rgba(26,34,48,.05);
  --planoFondo:#ffffff; --planoFiltro:none; --toque:rgba(127,127,127,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --bg:#0e1420; --panel:#16213a; --panel2:#121b30; --campo:#1c2843; --chip:#1f2b47;
    --ink:#f2f0ec; --muted:#9aa3b5; --line:#24304a;
    --headBg:linear-gradient(135deg,#0a0f19,#121b30); --headInk:#f2f0ec; --headMuted:#8f9bb3;
    --out:#3d2b16; --outInk:#f2f0ec; --outMeta:#d9b88a; --citaBg:rgba(0,0,0,.22);
    --accent:#e0a35c; --onAccent:#0e1420; --link:#e0a35c; --hl:#e0a35c;
    --pend:#ef6b5f; --listo:#4cc085; --sin:#7f8db0; --tocada:#e0a35c; --danger:#ef6b5f;
    --sombra:none; --patron:rgba(255,255,255,.04);
    --planoFondo:#121a2b; --planoFiltro:invert(.88) hue-rotate(180deg); --toque:rgba(255,255,255,.08);
    color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --bg:#0e1420; --panel:#16213a; --panel2:#121b30; --campo:#1c2843; --chip:#1f2b47;
  --ink:#f2f0ec; --muted:#9aa3b5; --line:#24304a;
  --headBg:linear-gradient(135deg,#0a0f19,#121b30); --headInk:#f2f0ec; --headMuted:#8f9bb3;
  --out:#3d2b16; --outInk:#f2f0ec; --outMeta:#d9b88a; --citaBg:rgba(0,0,0,.22);
  --accent:#e0a35c; --onAccent:#0e1420; --link:#e0a35c; --hl:#e0a35c;
  --pend:#ef6b5f; --listo:#4cc085; --sin:#7f8db0; --tocada:#e0a35c; --danger:#ef6b5f;
  --sombra:none; --patron:rgba(255,255,255,.04);
  --planoFondo:#121a2b; --planoFiltro:invert(.88) hue-rotate(180deg); --toque:rgba(255,255,255,.08);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,Roboto,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
[hidden]{display:none!important}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pantalla{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.top{background:var(--headBg);color:var(--headInk);display:flex;align-items:center;gap:6px;padding:8px 6px 8px 12px;padding-top:calc(8px + env(safe-area-inset-top));min-height:58px;flex:none}
.top h1{font-size:19px;font-weight:700;flex:1;margin:0;letter-spacing:.01em}
.top h1 small{display:block;font-size:12px;font-weight:700;color:var(--hl);letter-spacing:.02em}
.top .marca{width:34px;height:34px;flex:none;margin-right:4px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:inherit;flex:none}
.ib:active{background:var(--toque)}
.tabs{display:flex;background:var(--headBg);flex:none;overflow-x:auto;scrollbar-width:none;box-shadow:0 2px 6px rgba(0,0,0,.18);position:relative;z-index:5}
.tabs button{flex:1 0 auto;padding:11px 12px 9px;color:var(--headMuted);font-weight:700;font-size:13.5px;border-bottom:3px solid transparent;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.tabs button.on{color:var(--hl);border-color:var(--hl)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* Candado */
#candado{align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px;background:linear-gradient(160deg,#0e1420,#16213a);color:#f2f0ec}
#candado .logo{width:92px;height:92px}
#candado p{color:#a9b3c7;max-width:320px;margin:0}
#candado .marcaTxt{font-size:15px;font-weight:700;letter-spacing:.02em;color:#e0a35c}
#candado input{width:100%;max-width:320px;background:#1c2843;color:#f2f0ec;border:1px solid #2c3a5c;border-radius:24px;padding:13px 18px;outline:none;text-align:center}
.boton{background:var(--accent);color:var(--onAccent);font-weight:700;border-radius:24px;padding:12px 26px}
#candado .boton{background:#c06818;color:#fff}

/* Plano */
#zonaPlano{padding-bottom:2px}
#planoWrap{margin:10px;border-radius:14px;overflow-x:auto;overflow-y:hidden;background:var(--planoFondo);scrollbar-width:thin;box-shadow:var(--sombra);border:1px solid var(--line)}
.lienzo{position:relative}
.lienzo img{width:100%;display:block;filter:var(--planoFiltro);user-select:none;-webkit-user-drag:none}
#planoWrap svg{position:absolute;inset:0;width:100%;height:100%}
.area polygon{stroke-width:5;stroke-linejoin:round;transition:fill .15s}
.area.sin polygon{fill:rgba(128,144,173,.06);stroke:var(--sin);stroke-opacity:.75;stroke-dasharray:16 10}
.area.tocada polygon{fill:rgba(224,163,92,.24);stroke:var(--tocada)}
.area.pend polygon{fill:rgba(214,69,69,.22);stroke:var(--pend)}
.area.listo polygon{fill:rgba(47,158,99,.22);stroke:var(--listo)}
.area.sel polygon{stroke:var(--accent);stroke-width:12;stroke-dasharray:none;fill:rgba(192,104,24,.30)}
.area:active polygon{fill:rgba(192,104,24,.40)}
.area text{pointer-events:none;font-weight:800;fill:#fff;paint-order:stroke;stroke:#1a2230;stroke-width:8px}
.leyenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 14px 8px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
#genGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px}
.gcard{padding:12px;border-radius:12px;background:var(--panel);border:1.5px dashed var(--line);text-align:left;box-shadow:var(--sombra);min-height:64px}
.gcard b{display:block;font-size:14px;font-weight:650;line-height:1.25}
.gcard small{color:var(--muted);font-size:12px}
.gcard.tocada{border:1.5px solid var(--tocada)}.gcard.pend{border:1.5px solid var(--pend)}.gcard.listo{border:1.5px solid var(--listo)}
.gcard.sel{outline:2.5px solid var(--accent);outline-offset:1px}
.pista{margin:6px 12px 16px;padding:18px 16px;border-radius:14px;background:var(--panel);border:1.5px dashed var(--line);color:var(--muted);text-align:center;font-size:14px;line-height:1.45}
.pista b{color:var(--ink);display:block;font-size:15px;margin-bottom:4px}
.pista .cifras{display:flex;justify-content:center;gap:14px;margin-top:10px;font-size:12.5px}
.pista .cifras span{display:flex;align-items:center;gap:5px}
.pista .cifras i{width:9px;height:9px;border-radius:50%;display:inline-block}
.seccion{color:var(--muted);font-size:13px;padding:14px 14px 4px;font-weight:600}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:15px;background:var(--sin)}
.av.tocada{background:#c98a3e}.av.pend{background:var(--pend)}.av.listo{background:var(--listo)}
.badge{background:var(--accent);color:var(--onAccent);border-radius:12px;min-width:21px;height:21px;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}

/* Conversación del área (debajo del plano) */
#chat{display:flex;flex-direction:column}
.barraZona{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:10px;padding:8px 4px 8px 12px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 3px 10px rgba(0,0,0,.10)}
.barraZona .av{width:40px;height:40px;font-size:14px}
.barraZona .titulo{flex:1;min-width:0;margin:0}
.barraZona .titulo b{display:block;font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.estBtn{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:2px 0}
.estBtn i{width:8px;height:8px;border-radius:50%;display:inline-block}
.estBtn svg{width:14px;height:14px}
.barraZona .ib{color:var(--muted)}
.titulo{flex:1;min-width:0;margin-left:6px}
.titulo b{display:block;font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titulo small{color:var(--muted);font-size:13px}
#selTop{background:var(--accent);color:var(--onAccent)}
#selTop b{flex:1;font-size:20px;font-weight:600;margin-left:10px}
#mensajes{flex:1;padding:6px 10px 12px;display:flex;flex-direction:column;background-color:var(--bg);background-image:radial-gradient(var(--patron) 1px,transparent 1px);background-size:22px 22px}
.dia{align-self:center;background:var(--chip);color:var(--muted);font-size:12px;font-weight:600;padding:5px 12px;border-radius:8px;margin:10px 0 6px;text-transform:uppercase;letter-spacing:.03em}
.vacioChat{align-self:center;background:var(--chip);color:var(--link);font-size:13px;padding:10px 14px;border-radius:10px;margin:14px 10px;text-align:center;max-width:320px}
.b{max-width:82%;align-self:flex-end;background:var(--out);color:var(--outInk);border-radius:10px 2px 10px 10px;padding:6px 8px 5px 9px;margin:3px 0;position:relative;box-shadow:var(--sombra);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.b.cont{border-radius:10px;margin-top:1px}
.b.sel::before{content:'';position:absolute;top:-2px;bottom:-2px;left:-100vw;right:-100vw;background:rgba(224,163,92,.25);pointer-events:none}
.b.flash{animation:flash 1.3s}
@keyframes flash{0%,60%{filter:brightness(1.25) saturate(1.3)}}
.b img,.b video{-webkit-user-drag:none;pointer-events:none}
.b .t{white-space:pre-wrap;word-wrap:break-word}
.reenv{font-size:12px;color:var(--outMeta);font-style:italic;display:flex;align-items:center;gap:4px;margin-bottom:2px}
.reenv svg{width:14px;height:14px}
.cita{display:flex;background:var(--citaBg);border-radius:6px;overflow:hidden;margin:0 -3px 4px -4px;min-width:150px}
.cita::before{content:'';width:4px;background:var(--accent);flex:none}
.cita div{flex:1;min-width:0;padding:5px 8px}
.cita b{display:block;font-size:13px;color:var(--accent);font-weight:650}
.cita span{display:block;font-size:13.5px;color:var(--outInk);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cita img{width:46px;height:46px;object-fit:cover;flex:none}
.hora{float:right;font-size:11px;color:var(--outMeta);margin:7px 0 -5px 10px;display:flex;align-items:center;gap:3px;white-space:nowrap}
.hora svg{width:16px;height:16px;stroke-width:2.2}
.hora .ok{color:var(--accent);display:flex}
.hora .st svg{width:11px;height:11px;fill:currentColor;stroke:none}
.b.media{padding:3px}
.b.media .cita,.b.media .reenv{margin:3px 3px 4px}
.b.media .marco{position:relative}
.b.media .img{display:block;width:min(260px,68vw);min-height:120px;max-height:360px;object-fit:cover;border-radius:8px;background:var(--chip)}
.b.media .marco .hora{position:absolute;right:6px;bottom:4px;margin:0;color:#fff;text-shadow:0 0 4px #000}
.b.media .marco .hora .ok{color:#ffd29a}
.b.media .pie{padding:5px 5px 2px 6px;max-width:min(260px,68vw)}
.b.media .play{position:absolute;inset:0;display:grid;place-items:center}
.b.media .play span{width:54px;height:54px;border-radius:50%;background:#0009;display:grid;place-items:center}
.b.media .play svg{fill:#fff;stroke:none;width:26px;height:26px;margin-left:3px}
.aud{display:flex;align-items:center;gap:10px;width:min(250px,64vw);padding:2px 0}
.aud .pb{width:36px;height:36px;display:grid;place-items:center;flex:none}
.aud .pb svg{fill:var(--outInk);stroke:none;width:26px;height:26px}
.aud .barra{flex:1;height:4px;border-radius:2px;background:rgba(127,127,127,.35);position:relative}
.aud .barra i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px;width:0}
.aud .barra b{position:absolute;top:-5px;width:13px;height:13px;border-radius:50%;background:var(--accent);left:-6px}
.aud .mic{width:40px;height:40px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:none;color:var(--accent)}
.aud .mic svg{width:20px;height:20px}
.aud-pie{display:flex;justify-content:space-between;font-size:11px;color:var(--outMeta);margin:2px 0 0 46px}

/* Composer */
#contexto{display:flex;align-items:center;gap:8px;margin:0 62px 0 6px;background:var(--campo);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:7px 4px 4px 7px;flex:none}
#contexto .cita{flex:1;margin:0;background:var(--citaBg);min-width:0}
#contexto .cita span{color:var(--ink)}
#contexto .ib{width:34px;height:34px;color:var(--muted)}
#contexto:not([hidden]) + #composer .caja{border-radius:0 0 22px 22px}
#composer{display:flex;align-items:flex-end;gap:6px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));flex:none;background:var(--bg);border-top:1px solid var(--line)}
#contexto:not([hidden]) + #composer{padding-top:0;border-top:0}
.caja{flex:1;display:flex;align-items:flex-end;background:var(--campo);border:1px solid var(--line);border-radius:25px;min-height:50px;padding:0 4px 0 16px}
.caja textarea{flex:1;background:none;border:0;resize:none;max-height:130px;padding:13px 0;outline:none;line-height:1.35;height:48px}
.caja .ib{color:var(--muted);height:48px;width:44px}
.redondo{width:50px;height:50px;border-radius:50%;background:var(--accent);color:var(--onAccent);display:grid;place-items:center;flex:none;box-shadow:0 2px 6px rgba(192,104,24,.35)}
.redondo:active{filter:brightness(1.1)}
#grabando{flex:1;display:flex;align-items:center;gap:12px;background:var(--campo);border:1px solid var(--line);border-radius:25px;min-height:50px;padding:0 8px 0 6px}
#grabando .punto{width:11px;height:11px;border-radius:50%;background:var(--danger);animation:late 1s infinite}
#grabando .tiempo{font-variant-numeric:tabular-nums;font-size:17px}
#grabando .msg{flex:1;color:var(--muted);font-size:14px}
#grabando .ib{color:var(--danger)}
@keyframes late{50%{opacity:.2}}

/* Cámara de varias fotos */
#camara{position:fixed;inset:0;background:#000;z-index:33;display:flex;flex-direction:column}
#camara video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.topCam{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;z-index:2}
.topCam .ib{background:#0006;color:#fff}
.barraCam{display:flex;align-items:center;justify-content:space-between;padding:18px 28px calc(24px + env(safe-area-inset-bottom));background:#000}
#disparo{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:#ffffff2e}
#disparo:active{background:#fff}
#camUltima{width:54px;height:54px;border-radius:10px;position:relative;background:#222;border:2px solid #fff}
#camUltima img{width:100%;height:100%;object-fit:cover;border-radius:8px}
#camUltima span{position:absolute;top:-9px;right:-9px;background:var(--accent);color:var(--onAccent);border-radius:11px;min-width:22px;height:22px;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
#camListo{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--onAccent);display:grid;place-items:center}
#camFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

/* Editor de fotos */
#editor{color:#f2f0ec;position:fixed;inset:0;background:#000;z-index:31;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
.topEd{display:flex;align-items:center;gap:2px;padding:calc(6px + env(safe-area-inset-top)) 6px 6px;flex:none}
.topEd .ib{color:#fff}
.topEd .ib.on{background:#ffffff33}
.topEd .sp{flex:1}
#escena{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#lienzoEd{position:relative;flex:none}
#medioEd,#medioEd img,#medioEd video{display:block;width:100%;height:100%}
#medioEd img{-webkit-user-drag:none;pointer-events:none}
#trazos{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#capas{position:absolute;inset:0}
#editor.lapiz #trazos{pointer-events:auto}
#editor.lapiz #capas{pointer-events:none}
.capa{position:absolute;left:0;top:0;white-space:pre;font-weight:800;line-height:1.15;text-align:center;font-family:system-ui,Roboto,"Segoe UI",sans-serif;cursor:move}
.capa.texto{text-shadow:0 0 .12em rgba(0,0,0,.6)}
.capa.etiqueta{padding:.25em .6em;border-radius:.5em}
.capa.sel{outline:2px dashed #ffffffcc;outline-offset:6px}
.capa .x{position:absolute;top:-17px;right:-17px;width:26px;height:26px;border-radius:50%;background:var(--danger);color:#fff;font:700 18px/1 system-ui;display:none;place-items:center;text-shadow:none;padding:0}
.capa.sel .x{display:grid}
#paleta{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;z-index:6}
#paleta button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 4px #0008}
#paleta button.on{transform:scale(1.35)}
#miniaturas{display:flex;gap:6px;overflow-x:auto;padding:6px 8px 2px;flex:none;touch-action:pan-x;scrollbar-width:none}
#miniaturas button{width:52px;height:52px;border-radius:6px;overflow:hidden;flex:none;border:2px solid transparent;position:relative;background:#222}
#miniaturas button.on{border-color:var(--accent)}
#miniaturas img,#miniaturas video{width:100%;height:100%;object-fit:cover;pointer-events:none}
#miniaturas i{position:absolute;right:3px;bottom:3px;width:9px;height:9px;border-radius:50%;background:#ffcc00;border:1px solid #000}
#miniaturas .mas{display:grid;place-items:center;color:#fff;border:1.5px dashed #ffffff88;background:none}
#todasPie{padding:2px 14px 0;flex:none}
#todasPie button{font-size:13px;color:#53bdeb;padding:4px 0}
#pieEd{display:flex;align-items:flex-end;gap:6px;padding:6px 6px calc(8px + env(safe-area-inset-bottom));flex:none}
#pieEd .caja{background:#1c2843;border-color:#2c3a5c}
#editor textarea{color:#f2f0ec}
#escribir{position:absolute;inset:0;background:#000c;z-index:5;display:flex;flex-direction:column}
#escribir textarea{flex:1;background:none;border:0;outline:none;text-align:center;font:800 32px/1.2 system-ui,Roboto,sans-serif;resize:none;padding:28vh 50px 0 20px;width:100%}
.gridSt{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:4px 12px 12px}
.gridSt button{font-size:32px;padding:6px 0;border-radius:10px}
.gridSt button:active{background:var(--toque)}
.gridEt{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 14px}
.gridEt button{padding:9px 14px;border-radius:10px;color:#fff;font-weight:700}
#visor .ib.on{background:#ffffff33}

/* Plan de culminación */
.planCab{margin:12px;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--sombra)}
.planCab h2{margin:0;font-size:18px}
.planCab .sub{color:var(--muted);font-size:13px;margin-top:4px}
.prog{height:6px;border-radius:3px;background:var(--chip);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.segm{display:flex;margin:4px 12px 8px;background:var(--panel);border-radius:10px;padding:3px;border:1px solid var(--line)}
.segm button{flex:1;padding:9px 0;border-radius:8px;font-size:14px;color:var(--muted)}
.segm button.on{background:var(--chip);color:var(--ink);font-weight:650}
details.blq{margin:6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sombra)}
details.blq.sub{margin:0;border:0;border-top:1px solid var(--line);border-radius:0;background:var(--panel2);box-shadow:none}
details.blq>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 12px 12px 14px;cursor:pointer}
details.blq>summary::-webkit-details-marker{display:none}
details.blq.sub>summary{padding-left:18px}
summary .st{flex:1;min-width:0}
summary .st b{font-weight:600;display:block}
summary .st small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
summary .flecha{color:var(--muted);transition:transform .15s;display:grid}
summary .flecha svg{width:20px;height:20px}
details[open]>summary .flecha{transform:rotate(90deg)}
.hoyChip{background:var(--accent);color:var(--onAccent);border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;vertical-align:1px}
.pdn{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.pd{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.pd.alta{background:var(--danger)}.pd.media{background:var(--hl)}.pd.baja{background:var(--sin)}
.pbody{padding:2px 14px 12px;font-size:14px}
.pbody p{margin:8px 0}
.pbody .aviso{color:var(--link)}
.pbody .res{color:var(--muted)}
.pact{display:flex;gap:10px;padding:10px 12px 10px 14px;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer}
.pact .chk{width:26px;height:26px;border-radius:7px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;margin-top:1px}
.pact .chk svg{width:18px;height:18px;stroke-width:3}
.pact .chk.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.pact .cuerpo{flex:1;min-width:0}
.pact .t{font-size:15px;line-height:1.3}
.pact.hecha .t{text-decoration:line-through;color:var(--muted)}
.pact .m{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.pact .cod{color:var(--accent);font-weight:700}
.pdet{display:none;margin-top:8px;font-size:14px;line-height:1.4}
.pact.abierta .pdet{display:block}
.pdet .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:9px}
.minis{display:flex;gap:6px;margin-top:9px;overflow-x:auto}
.minis img{width:86px;height:86px;object-fit:cover;border-radius:8px;flex:none;background:var(--chip)}
.accPer{display:flex;gap:8px;padding:4px 14px 12px}
.btnAcc{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 6px;border-radius:22px;background:var(--chip);border:1px solid var(--line);font-weight:600;font-size:14px}
.btnAcc.verde{background:#25d366;border-color:#25d366;color:#0b141a}
#btnPdfGeneral{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btnAcc svg{width:18px;height:18px}

/* Recortar y girar */
#recorte{position:absolute;inset:0;z-index:4;touch-action:none}
#cajaRec{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.62);
  background-image:linear-gradient(to right,transparent 33.1%,rgba(255,255,255,.45) 33.3%,transparent 33.6%,transparent 66.4%,rgba(255,255,255,.45) 66.6%,transparent 66.9%),
  linear-gradient(to bottom,transparent 33.1%,rgba(255,255,255,.45) 33.3%,transparent 33.6%,transparent 66.4%,rgba(255,255,255,.45) 66.6%,transparent 66.9%)}
#cajaRec i{position:absolute;width:30px;height:30px;border:4px solid #fff}
#cajaRec i[data-c=nw]{top:-6px;left:-6px;border-right:0;border-bottom:0}
#cajaRec i[data-c=ne]{top:-6px;right:-6px;border-left:0;border-bottom:0}
#cajaRec i[data-c=sw]{bottom:-6px;left:-6px;border-right:0;border-top:0}
#cajaRec i[data-c=se]{bottom:-6px;right:-6px;border-left:0;border-top:0}
#barraRec{display:flex;align-items:center;gap:6px;padding:12px 10px calc(16px + env(safe-area-inset-bottom));flex:none}
#barraRec button{color:#fff;padding:10px 14px;border-radius:22px;display:flex;align-items:center;gap:7px;font-weight:600}
#barraRec button svg{width:20px;height:20px}
#barraRec .sp{flex:1}
#recListo{background:var(--accent);color:var(--onAccent)!important}
#editor:not(.recortando) #barraRec{display:none}
#editor.recortando .topEd,#editor.recortando #miniaturas,#editor.recortando #todasPie,#editor.recortando #pieEd,#editor.recortando #paleta,#editor.recortando #trazos,#editor.recortando #capas{display:none!important}

/* Hoja inferior, visor, toast */
#fondo{position:fixed;inset:0;background:#0008;z-index:34}
#hoja{position:fixed;left:0;right:0;bottom:0;background:var(--panel);color:var(--ink);box-shadow:0 -4px 20px rgba(0,0,0,.25);border-radius:18px 18px 0 0;z-index:35;padding:8px 0 calc(12px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;animation:sube .18s ease-out}
@keyframes sube{from{transform:translateY(40px);opacity:.4}}
#hoja .tira{width:36px;height:4px;border-radius:2px;background:rgba(127,127,127,.35);margin:4px auto 10px}
#hoja h3{margin:4px 20px 10px;font-size:16px}
#hoja p{margin:0 20px 12px;color:var(--muted);font-size:14px}
.op{display:flex;align-items:center;gap:18px;width:100%;padding:14px 22px;text-align:left;font-size:16px}
.op:active{background:var(--toque)}
.op svg{color:var(--muted)}
.op.rojo,.op.rojo svg{color:var(--danger)}
.op small{display:block;color:var(--muted);font-size:13px}
.op .mini{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none;background:var(--chip);display:grid;place-items:center}
.op .cuerpo{flex:1;min-width:0}
.op .cuerpo span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gridOps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 14px 10px}
.gridOps button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:8px 0}
.gridOps span{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff}
#visor{color:#f2f0ec;position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
#visor .top{background:#000a}
#visor .medio{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
#visor img,#visor video{max-width:100%;max-height:100%}
#vPie{padding:10px 16px calc(14px + env(safe-area-inset-bottom));text-align:center;white-space:pre-wrap;background:#000a}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:22px;font-size:14px;z-index:40;max-width:90vw;text-align:center;box-shadow:0 4px 18px #0006}
</style>
</head>

};

const $ = s => document.querySelector(s);

// ---------- Base de datos del teléfono (IndexedDB) ----------
let DB;
const req = r => new Promise((ok, mal) => { r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error); });
function abrirDB(){
  return new Promise((ok, mal) => {
    const r = indexedDB.open(DB_NOMBRE, 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('msgs', {keyPath:'id'}).createIndex('area','area'); d.createObjectStore('kv'); };
    r.onsuccess = () => ok(DB = r.result); r.onerror = () => mal(r.error);
  });
}
const st = (s, m='readonly') => DB.transaction(s, m).objectStore(s);
const kvGet = k => req(st('kv').get(k));
const kvSet = (k, v) => req(st('kv','readwrite').put(v, k));
const msgPut = m => req(st('msgs','readwrite').put(m));
const msgDel = id => req(st('msgs','readwrite').delete(id));
const msgsDe = a => req(st('msgs').index('area').getAll(a));
const msgsTodos = () => req(st('msgs').getAll());

// ---------- Estado de la app ----------

const AREAS = {};           // id -> {id,nivel,nombre,carpeta}
const NIVELES = {gen:'Generales'};
let ESTADOS = {};           // id -> 'sin'|'pend'|'listo'
let RES = {};               // id -> {n, nuevos, ultimo}
let tab = null, abierta = null, urls = [];
let MSGS = [];
const selec = new Set();    // mensajes seleccionados (toque largo)
let respondiendo = null, editando = null;

function toast(t, ms=2600){ const e=$('#toast'); e.textContent=t; e.hidden=false; clearTimeout(toast.t); if(ms) toast.t=setTimeout(()=>e.hidden=true, ms); }
const iniciales = n => { const p = n.replace(/[^\p{L}\p{N} ]/gu,'').split(/\s+/).filter(Boolean); return ((p[0]||'')[0] + ((p[1]||'')[0]||'')).toUpperCase(); };
const hora = d => new Date(d).toLocaleTimeString('es-VE', {hour:'numeric', minute:'2-digit'});
function diaTxt(d){
  const f = new Date(d), h = new Date(); const s = x => x.toDateString();
  if (s(f)===s(h)) return 'Hoy';
  const a = new Date(h); a.setDate(h.getDate()-1); if (s(f)===s(a)) return 'Ayer';
  return f.toLocaleDateString('es-VE', {weekday:'long', day:'numeric', month:'long'});
}
function cuandoCorto(d){ const f=new Date(d), h=new Date(); return f.toDateString()===h.toDateString() ? hora(d) : f.toLocaleDateString('es-VE',{day:'2-digit',month:'2-digit'}); }
const mmss = s => { s = Math.max(0, Math.round(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const claseDe = id => { const e = ESTADOS[id]||'sin'; if (e!=='sin') return e; return (RES[id]&&RES[id].n) ? 'tocada' : 'sin'; };
const ptsDe = a => a.pts || [[a.rect[0],a.rect[1]],[a.rect[0]+a.rect[2],a.rect[1]],[a.rect[0]+a.rect[2],a.rect[1]+a.rect[3]],[a.rect[0],a.rect[1]+a.rect[3]]];
const pendiente = m => !m.exportado || m.meta;          // falta mandarlo (o mandar su cambio) a la PC
const tocar = m => { if (m.exportado) m.meta = true; };  // un cambio en algo ya enviado
// Texto corto de un mensaje, para citas y listas
function resumen(m){
  if (!m) return 'Mensaje';
  if (m.tipo==='texto') return m.texto || '';
  const base = m.tipo==='foto' ? 'Foto' : m.tipo==='video' ? 'Video' : 'Audio ' + mmss(m.dur);
  return m.texto ? base + ' · ' + m.texto : base;
}

function prepararAreas(){
  for (const n of P.niveles){ NIVELES[n.id] = n.nombre;
    for (const a of n.areas) AREAS[n.id+'-'+a.id] = {id:n.id+'-'+a.id, nivel:n.id, nombre:a.nombre, carpeta:n.cod+' '+a.nombre}; }
  for (const g of P.generales)
    AREAS['gen-'+g.id] = {id:'gen-'+g.id, nivel:'gen', nombre:g.nombre, carpeta:'GEN '+g.nombre.replace(/[\/\\:*?"<>|]/g,'-')};
  tab = P.niveles[0].id;
}

async function recalcular(){
  RES = {}; for (const id in AREAS) RES[id] = {n:0, nuevos:0, ultimo:null};
  for (const m of await msgsTodos()){
    const r = RES[m.area]; if (!r) continue;
    r.n++; if (pendiente(m)) r.nuevos++;
    if (!r.ultimo || m.fecha > r.ultimo.fecha) r.ultimo = {tipo:m.tipo, texto:m.texto, dur:m.dur, fecha:m.fecha};
  }
}

// ---------- Candado y descifrado ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function descifrar(clave){
  const enc = await (await fetch('planos.enc', {cache:'no-cache'})).json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(enc.salt), iterations:enc.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(enc.iv)}, key, b64(enc.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
$('#btnAbrir').onclick = async () => {
  const c = $('#clave').value.trim(); if (!c) return;
  $('#btnAbrir').textContent = 'Abriendo…';
  try { P = await descifrar(c); await kvSet('payload2', P); await kvSet('clave', c); await arrancar(); }
  catch(e){ $('#errClave').textContent = e.name==='OperationError' ? 'Clave incorrecta.' : 'No pude abrir: ' + e.message; }
  $('#btnAbrir').textContent = 'Abrir';
};
$('#clave').onkeydown = e => { if (e.key==='Enter') $('#btnAbrir').click(); };

async function arrancar(){
  prepararAreas();
  ESTADOS = (await kvGet('estados')) || {};
  await recalcular();
  $('#titulo').textContent = 'Recorrido ' + (P.titulo||'');
  document.title = 'Recorrido ' + (P.titulo||'');
  $('#candado').hidden = true; $('#inicio').hidden = false;
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch(e){}
  pintarInicio();
  refrescarPlanos();
}
// Si hay internet y los planos cambiaron (áreas nuevas), se actualizan solos con la clave guardada.
async function refrescarPlanos(){
  try {
    const c = await kvGet('clave'); if (!c) return;
    const nuevo = await descifrar(c);
    if (JSON.stringify(nuevo) !== JSON.stringify(P)){
      await kvSet('payload2', nuevo);
      const mismos = JSON.stringify([nuevo.niveles, nuevo.generales]) === JSON.stringify([P.niveles, P.generales]);
      const planNuevo = JSON.stringify(nuevo.plan || null) !== JSON.stringify(P.plan || null);
      if (mismos){ P = nuevo; if (!$('#inicio').hidden) pintarInicio(); if (planNuevo && P.plan) toast('Llegaron las acciones: pestaña ACCIONES.', 5000); }
      else toast('Planos actualizados. Cierra y abre la app para verlos.', 5000);
    }
  } catch(e){}
}

// "Estamos en la Sala", "en el Baño principal", "en los Depósitos"…
function articulo(n){
  const w = n.trim().split(/\s+/)[0].toLowerCase();
  if (['área', 'agua'].includes(w)) return 'el';
  if (['instalaciones', 'fachadas'].includes(w)) return 'las';
  if (['baño','balcón','pasillo','comedor','recibo','sanitario','vestier','cuarto','depósito','estacionamiento','family','lavandero','gimnasio','caney','muelle','techo','servidor','jacuzzi','closet','tanque','patio','jardín'].includes(w)) return 'el';
  if (w.endsWith('as')) return 'las';
  if (w.endsWith('os') || w.endsWith('es')) return 'los';
  return 'la';
}

$('#chatSub').onclick = () => {

};
const ticks = m => (m.exportado && !m.meta) ? `<span class="ok">${ic('doble')}</span>` : ic('check');
const horaHTML = m => `<span class="hora">${m.destacado?`<span class="st">${ic('estrella')}</span>`:''}${m.editado?'Editado ':''}${hora(m.fecha)} ${ticks(m)}</span>`;

function citaHTML(r){
  const o = MSGS.find(x => x.id === r.id);
  const mini = o && o.thumb ? `<img src="${url(o.thumb)}" alt="">` : '';
  return `<div class="cita" data-cita="${esc(r.id)}"><div><b>Tú</b><span>${esc(resumen(o || r))}</span></div>${mini}</div>`;
}
function burbuja(m, cont){
  const h = horaHTML(m), cl = 'b' + (cont?' cont':'') + (selec.has(m.id)?' sel':'');
  const pre = (m.reenviado?`<div class="reenv">${ic('reenviar')}Reenviado</div>`:'') + (m.resp?citaHTML(m.resp):'');
  if (m.tipo==='texto') return `<div class="${cl}" data-id="${m.id}">${pre}<span class="t">${esc(m.texto)}</span>${h}</div>`;
  if (m.tipo==='foto' || m.tipo==='video'){
    const med = m.tipo==='foto'
      ? (m.thumb?`<img class="img" src="${url(m.thumb)}" alt="">`:`<div class="img" style="display:grid;place-items:center;color:var(--muted)">${ic('imagen')}</div>`)
      : `<video class="img" src="${url(m.blob)}#t=0.3" preload="metadata" muted playsinline></video><div class="play"><span><svg class="i" viewBox="0 0 24 24">${IC.play}</svg></span></div>`;
    return `<div class="${cl} media" data-id="${m.id}">${pre}<div class="marco">${med}${m.texto?'':h}</div>${m.texto?`<div class="pie"><span class="t">${esc(m.texto)}</span>${h}</div>`:''}</div>`;
  }
  if (m.tipo==='audio') return `<div class="${cl}" data-id="${m.id}">${pre}<div class="aud"><button class="pb" data-play="${m.id}"><svg class="i" viewBox="0 0 24 24">${IC.play}</svg></button><div class="barra"><i></i><b></b></div><div class="mic">${ic('mic')}</div></div><div class="aud-pie"><span class="dur">${mmss(m.dur)}</span>${h}</div></div>`;
  return '';
}
async function pintarMensajes(alFinal, suave){
  soltarUrls();
  MSGS = (await msgsDe(abierta)).sort((a,b) => a.fecha.localeCompare(b.fecha));
  const c = $('#mensajes'), sc = $('#scrollInicio'), arriba = sc.scrollTop; let html = '', dia = '', prev = null;
  if (!MSGS.length) html = `<div class="vacioChat">Manda aquí fotos, audios y notas de ${esc(AREAS[abierta].nombre)}. Todo queda guardado en este teléfono, aunque no haya señal.</div>`;
  for (const m of MSGS){
    const d = new Date(m.fecha).toDateString();
    if (d !== dia){ html += `<div class="dia">${diaTxt(m.fecha)}</div>`; dia = d; prev = null; }
    const cont = prev && (new Date(m.fecha) - new Date(prev.fecha) < 120000);
    html += burbuja(m, cont); prev = m;
  }
  $('#chat').style.minHeight = sc.clientHeight + 'px';   // así el plano siempre puede esconderse arriba
  c.innerHTML = html;
  c.querySelectorAll('.b').forEach(conectarBurbuja);
  if (alFinal) requestAnimationFrame(() => sc.scrollTo({top: sc.scrollHeight, behavior: suave ? 'smooth' : 'auto'})); else sc.scrollTop = arriba;
}
function conectarBurbuja(el){
  const m = MSGS.find(x => x.id === el.dataset.id); if (!m) return;
  let t = null, largo = false, desliza = false, activo = false, x0 = 0, y0 = 0, dx = 0;
  el.addEventListener('pointerdown', e => {
    activo = true; largo = false; desliza = false; dx = 0; x0 = e.clientX; y0 = e.clientY;
    t = setTimeout(() => { if (!activo) return; largo = true; vibrar(30); alternarSel(m.id); }, 450);
  });
  el.addEventListener('pointermove', e => {
    if (!activo) return; const ax = e.clientX - x0, ay = e.clientY - y0;
    if (Math.abs(ax) + Math.abs(ay) > 10) clearTimeout(t);
    if (!selec.size && !largo && ax > 12 && Math.abs(ax) > Math.abs(ay)*1.5){ desliza = true; dx = Math.min(80, ax); el.style.transform = `translateX(${dx}px)`; }
  });
  const fin = () => {
    clearTimeout(t); activo = false;
    if (desliza){ el.style.transition = 'transform .15s'; el.style.transform = ''; setTimeout(() => el.style.transition = '', 160); if (dx >= 56){ vibrar(20); responderA(m); } }
  };
  el.addEventListener('pointerup', fin); el.addEventListener('pointercancel', fin);
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('click', e => {
    if (largo || desliza){ largo = false; desliza = false; return; }
    if (selec.size){ alternarSel(m.id); return; }
    if (e.target.closest('[data-play]')){ tocarAudio(m, el); return; }
    const q = e.target.closest('[data-cita]'); if (q){ irA(q.dataset.cita); return; }
    if (m.tipo==='foto' || m.tipo==='video') abrirVisor(m);
  });
}
function irA(id){
  const el = $('#mensajes').querySelector(`.b[data-id="${id}"]`);
  if (!el){ toast('Ese mensaje ya no está en esta área.'); return; }
  el.scrollIntoView({block:'center', behavior:'smooth'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

let rec = null, recStream = null, recTrozos = [], recIni = 0, recReloj = null, recCancelar = false, recArea = null;
async function iniciarGrab(){
  if (!navigator.mediaDevices || !window.MediaRecorder){ toast('Este navegador no deja grabar. Usa Chrome.'); return; }
  try { recStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); }
  catch(e){ toast('No tengo permiso del micrófono. Actívalo en los permisos del sitio.', 4000); return; }

  return t.includes('jpeg')?'jpg':t.includes('png')?'png':t.includes('mp4')?(m.tipo==='audio'?'m4a':'mp4'):t.includes('webm')?'webm':t.includes('ogg')?'ogg':'bin';
}
async function exportar(todo){
  cerrarHoja();
  const lista = (await msgsTodos()).filter(m => todo || pendiente(m)).sort((a,b) => a.fecha.localeCompare(b.fecha));
  const borrados = (await kvGet('borrados')) || [];
  if (!lista.length && !borrados.length){ toast('No hay nada nuevo por enviar.'); return; }
  const entradas = [], mensajes = [];
  const grandes = lista.filter(m => m.tipo === 'foto' && (todo || !m.exportado) && ((m.blob && m.blob.size > 700*1024) || (m.original && m.original.size > 700*1024)));
  for (let i = 0; i < grandes.length; i++){ toast(`Comprimiendo fotos: ${i + 1} de ${grandes.length}…`, 0); await comprimirMsg(grandes[i]); }
  for (const m of lista){
    const a = AREAS[m.area]; if (!a) continue;
    const reg = {id:m.id, area:m.area, carpeta:a.carpeta, tipo:m.tipo, fecha:m.fecha, texto:m.texto||null, dur:m.dur||null, tomada:m.tomada||null, original:m.nombre||null,
      destacado:!!m.destacado, editado:!!m.editado, reenviado:!!m.reenviado, editada:!!m.editada, responde_a:m.resp ? m.resp.id : null, archivo:null};
    if (m.blob){
      reg.archivo = `areas/${a.carpeta}/${sello(m.fecha)} ${m.tipo} ${m.id.slice(-4)}.${extension(m)}`;
      if (todo || !m.exportado) entradas.push({nombre:reg.archivo, blob:m.blob});   // lo ya enviado solo manda su cambio, no el archivo otra vez
    }
    if (m.original){   // foto con dibujos: también va la original, sin tocar
      const e0 = ((m.original.name||'').match(/\.([a-z0-9]{2,5})$/i) || [0,'jpg'])[1].toLowerCase();
      reg.original_archivo = `areas/${a.carpeta}/originales/${sello(m.fecha)} ${m.tipo} ${m.id.slice(-4)} original.${e0}`;
      if (todo || !m.exportado) entradas.push({nombre:reg.original_archivo, blob:m.original});
    }
    mensajes.push(reg);
  }
  const json = {origen:'telefono', titulo:P.titulo, exportado:new Date().toISOString(), estados:ESTADOS, borrados,
    plan_hechos: P.plan ? {version: P.plan.version, ids: (await kvGet('planHechos')) || {}} : null,
    plan_asignaciones: P.plan ? {version: P.plan.version, ...((await kvGet('planAsign')) || {ids: {}, personas: []})} : null,
    areas:Object.fromEntries(Object.values(AREAS).map(a => [a.id, {nivel:NIVELES[a.nivel], nombre:a.nombre, carpeta:a.carpeta}])), mensajes};
  entradas.push({nombre:'recorrido-telefono.json', blob:new Blob([JSON.stringify(json, null, 2)], {type:'application/json'})});
  let zip;
  try { zip = await hacerZip(entradas, (i,n) => toast(`Armando el zip: ${i} de ${n}…`, 0)); }
  catch(e){ toast('No pude armar el zip: ' + e.message, 5000); return; }
  const nombreZip = `recorrido ${(P.titulo||'').trim()} ${sello(new Date())}.zip`.replace(/\s+/g,' ');
  const file = new File([zip], nombreZip, {type:'application/zip'});
  const mb = (zip.size/1048576).toFixed(1);
  $('#toast').hidden = true;
  const marcar = async () => { for (const m of lista){ m.exportado = true; m.meta = false; await msgPut(m); } await kvSet('borrados', []); await recalcular(); if (abierta) await pintarMensajes(false); else pintarInicio(); };
  const puedeCompartir = navigator.canShare && navigator.canShare({files:[file]});
  hoja(`<h3>Zip listo · ${mb} MB</h3><p>${lista.length} mensaje(s). Pásalo a la PC y dile a Claude "importa el recorrido del teléfono".</p>
    ${puedeCompartir?`<button class="op" data-a="comp">${ic('subir')}<div>Compartir<small>WhatsApp, Drive, correo…</small></div></button>`:''}
    <button class="op" data-a="desc">${ic('bajar')}<div>Guardar en Descargas<small>Lo pasas luego por cable o Drive</small></div></button>`, h => {
    const c = h.querySelector('[data-a=comp]');
    if (c) c.onclick = async () => { try { await navigator.share({files:[file], title:nombreZip}); cerrarHoja(); await marcar(); toast('Enviado. Los mensajes quedan con ✓✓ azul.'); } catch(e){ if (e.name!=='AbortError') toast('No se pudo compartir: ' + e.message, 4000); } };
    h.querySelector('[data-a=desc]').onclick = async () => {
      const u = URL.createObjectURL(file), a = document.createElement('a'); a.href = u; a.download = nombreZip; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 60000); cerrarHoja(); await marcar(); toast('Guardado en Descargas.');
    };
  });
}

  ['Medir','#5856d6'],['Retocar pintura','#ff9500'],['Cambiar','#ff3b30'],['Limpiar','#8e8e93'],['Listo','#34c759'],['OK','#34c759']];

function abrirEditor(files, sinPush){

function ajustarLienzo(){

// Lápiz: los trazos se guardan en proporción a la foto (0 a 1), así salen igual en la foto final.
function trazar(g, W, H, trazos){
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (const t of trazos){
    g.strokeStyle = t.c; g.lineWidth = t.w*W; g.beginPath();
    t.pts.forEach(([x,y], i) => i ? g.lineTo(x*W, y*H) : g.moveTo(x*W, y*H));
    if (t.pts.length === 1) g.lineTo(t.pts[0][0]*W + 0.5, t.pts[0][1]*H);
    g.stroke();
  }
}
function dibujarTrazos(){ const cv = $('#trazos'), g = cv.getContext('2d'), it = itemEd(); g.clearRect(0, 0, cv.width, cv.height); if (it) trazar(g, cv.width, cv.height, it.trazos); }
let trazoAct = null;
const normEd = e => { const r = $('#lienzoEd').getBoundingClientRect(); return [(e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height]; };
$('#trazos').addEventListener('pointerdown', e => {
  if (!ED.lapiz) return; $('#trazos').setPointerCapture(e.pointerId);
  trazoAct = {c:ED.color, w:0.009, pts:[normEd(e)]}; itemEd().trazos.push(trazoAct); dibujarTrazos();
});
$('#trazos').addEventListener('pointermove', e => { if (!trazoAct) return; trazoAct.pts.push(normEd(e)); dibujarTrazos(); });
const finTrazo = () => { if (!trazoAct) return; trazoAct = null; herramientas(); pintarMiniaturas(); };
$('#trazos').addEventListener('pointerup', finTrazo); $('#trazos').addEventListener('pointercancel', finTrazo);

// Texto, etiquetas y stickers: capas que se mueven con un dedo y se agrandan/giran con dos.
function estiloCapa(el, c){
  el.style.fontSize = (c.s*LZ.w) + 'px';
  el.style.transform = `translate(${c.x*LZ.w}px, ${c.y*LZ.h}px) translate(-50%,-50%) rotate(${c.r}rad)`;
  if (c.tipo === 'etiqueta'){ el.style.background = c.bg; el.style.color = '#fff'; }
  else if (c.tipo === 'texto') el.style.color = c.color;
}
function pintarCapas(){
  const box = $('#capas'), it = itemEd(); box.innerHTML = ''; if (!it) return;
  it.capas.forEach((c, i) => {
    const el = document.createElement('div'); el.className = 'capa ' + c.tipo + (ED.sel === c ? ' sel' : ''); el.dataset.i = i;
    const t = document.createElement('span'); t.textContent = c.txt; el.appendChild(t);
    const x = document.createElement('button'); x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', 'Quitar');
    x.onclick = ev => { ev.stopPropagation(); it.capas.splice(it.capas.indexOf(c), 1); ED.sel = null; pintarCapas(); pintarPaleta(); pintarMiniaturas(); };
    el.appendChild(x); estiloCapa(el, c); box.appendChild(el);
  });

function marcarSel(){ const it = itemEd(); $('#capas').querySelectorAll('.capa').forEach(el => el.classList.toggle('sel', it.capas[+el.dataset.i] === ED.sel)); pintarPaleta(); }
function moverCapa(c){ const el = $('#capas').querySelector(`.capa[data-i="${itemEd().capas.indexOf(c)}"]`); if (el) estiloCapa(el, c); }
function nuevaCapa(c){ ED.lapiz = false; itemEd().capas.push(c); ED.sel = c; herramientas(); pintarCapas(); pintarMiniaturas(); }

const GEST = {ptrs:new Map(), capa:null, base:null, movio:false, t0:0, eraSel:false};
const dist = (a, b) => Math.hypot(a.x-b.x, a.y-b.y), ang = (a, b) => Math.atan2(b.y-a.y, b.x-a.x);
const medio = p => ({x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2});
const fotoGest = () => { const c = ED.sel; return {p:[...GEST.ptrs.values()].map(q => ({...q})), x:c&&c.x, y:c&&c.y, s:c&&c.s, r:c&&c.r}; };
const escena = $('#escena');
escena.addEventListener('pointerdown', e => {
  const it = itemEd(); if (!it || ED.lapiz || it.video || REC || e.target.closest('.x')) return;
  escena.setPointerCapture(e.pointerId);
  GEST.ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (GEST.ptrs.size === 1){
    GEST.movio = false; GEST.t0 = Date.now();
    const el = e.target.closest('.capa');
    if (el){ const c = it.capas[+el.dataset.i]; GEST.eraSel = ED.sel === c; ED.sel = c; GEST.capa = c; marcarSel(); }
    else { GEST.capa = null; if (ED.sel){ ED.sel = null; marcarSel(); } }
  }
  GEST.base = fotoGest();
});
escena.addEventListener('pointermove', e => {
  if (!GEST.ptrs.has(e.pointerId)) return;
  GEST.ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const c = ED.sel, b = GEST.base; if (!c || !b) return;
  const p = [...GEST.ptrs.values()];
  if (p.length === 1 && GEST.capa){
    const dx = p[0].x - b.p[0].x, dy = p[0].y - b.p[0].y; if (Math.abs(dx) + Math.abs(dy) > 5) GEST.movio = true;
    c.x = Math.min(1, Math.max(0, b.x + dx/LZ.w)); c.y = Math.min(1, Math.max(0, b.y + dy/LZ.h));
  } else if (p.length >= 2 && b.p.length >= 2){
    c.s = Math.max(0.02, Math.min(0.7, b.s * dist(p[0], p[1]) / Math.max(1, dist(b.p[0], b.p[1]))));
    c.r = b.r + ang(p[0], p[1]) - ang(b.p[0], b.p[1]);
    const m0 = medio(b.p), m1 = medio(p); c.x = b.x + (m1.x-m0.x)/LZ.w; c.y = b.y + (m1.y-m0.y)/LZ.h; GEST.movio = true;
  }
  moverCapa(c);
});
const finGest = e => {
  if (!GEST.ptrs.has(e.pointerId)) return;
  GEST.ptrs.delete(e.pointerId);
  if (!GEST.ptrs.size){
    const c = GEST.capa;
    if (c && !GEST.movio && GEST.eraSel && Date.now() - GEST.t0 < 400 && c.tipo !== 'sticker') abrirEscribir(c);   // tocar de nuevo = editar
    GEST.capa = null;
  }
  GEST.base = fotoGest();
};
escena.addEventListener('pointerup', finGest); escena.addEventListener('pointercancel', finGest);

// Pantalla para escribir (texto nuevo, o editar uno / una etiqueta)

  else if (t){ const c = {tipo:'texto', txt:t, color:ED.color, x:.5, y:.4, s:.075, r:0}; it.capas.push(c); ED.sel = c; }

function pintarPaleta(){
  const p = $('#paleta'), escribiendo = !$('#escribir').hidden, s = ED.sel;
  const ver = ED.lapiz || escribiendo || (s && s.tipo !== 'sticker'); p.hidden = !ver; if (!ver) return;
  const actual = escribiendo ? (escCapa && escCapa.tipo === 'etiqueta' ? escCapa.bg : (escCapa ? escCapa.color : ED.color)) : (!ED.lapiz && s ? (s.bg || s.color) : ED.color);
  p.innerHTML = COLORES.map(c => `<button data-c="${c}" style="background:${c}" class="${c===actual?'on':''}" aria-label="Color ${c}"></button>`).join('');

function elegirColor(c){
  ED.color = c;

    const t = $('#escTexto');
    if (escCapa && escCapa.tipo === 'etiqueta'){ escCapa.bg = c; t.style.background = c; } else { t.style.color = c; if (escCapa) escCapa.color = c; }
  } else if (ED.sel && !ED.lapiz){

// Foto final: la original + trazos + capas, en una sola imagen (máx. 2560 px de lado).
function redondeado(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r); g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath(); }
function capaEnLienzo(g, W, H, c){
  const fs = c.s*W, lineas = c.txt.split('\n'), lh = fs*1.15, alto = lh*lineas.length;
  g.save(); g.translate(c.x*W, c.y*H); g.rotate(c.r);
  g.font = `800 ${fs}px ${FUENTE}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (c.tipo === 'etiqueta'){
    const w = Math.max(...lineas.map(l => g.measureText(l).width)) + fs*1.2, h = alto + fs*0.5;
    g.fillStyle = c.bg; redondeado(g, -w/2, -h/2, w, h, fs*0.5); g.fill(); g.fillStyle = '#fff';
  } else {
    g.fillStyle = c.color || '#fff';
    if (c.tipo === 'texto'){ g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = fs*0.12; }
  }
  lineas.forEach((l, i) => g.fillText(l, 0, -alto/2 + lh*(i + .5)));
  g.restore();
}
async function componer(it){
  const bm = await createImageBitmap(it.file);
  const k = Math.min(1, 2560/Math.max(bm.width, bm.height)), W = Math.round(bm.width*k), H = Math.round(bm.height*k);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
  g.drawImage(bm, 0, 0, W, H); if (bm.close) bm.close();
  trazar(g, W, H, it.trazos);
  for (const c of it.capas) capaEnLienzo(g, W, H, c);
  return await new Promise(ok => cv.toBlob(ok, 'image/jpeg', .9));
}

// ---------- Compresor de fotos (como WhatsApp: lado mayor 2048 px, JPEG 82 %) ----------
async function comprimir(blob, nombre = 'foto.jpg', lado = 2048, q = .82){
  try {
    if (!blob || blob.size < 500*1024) return {blob, nombre};
    if (blob.type && !/^image\/(jpeg|png|webp|heic|heif)/.test(blob.type)) return {blob, nombre};
    const bm = await createImageBitmap(blob); const k = Math.min(1, lado/Math.max(bm.width, bm.height));
    const c = document.createElement('canvas'); c.width = Math.round(bm.width*k); c.height = Math.round(bm.height*k);
    c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height); if (bm.close) bm.close();
    const b = await new Promise(ok => c.toBlob(ok, 'image/jpeg', q));
    if (!b || b.size >= blob.size) return {blob, nombre};
    return {blob: b, nombre: (nombre || 'foto').replace(/\.[^.]*$/, '') + '.jpg'};
  } catch(e){ return {blob, nombre}; }
}
// Comprime en el teléfono una foto ya guardada (y su original sin dibujos), y la deja así para liberar espacio.
async function comprimirMsg(m){
  if (m.tipo !== 'foto') return false;
  let cambio = false;
  if (m.blob && m.blob.size > 700*1024){ const c = await comprimir(m.blob, m.nombre); if (c.blob !== m.blob){ m.blob = c.blob; m.nombre = c.nombre; cambio = true; } }
  if (m.original && m.original.size > 700*1024){ const c = await comprimir(m.original, m.original.name || 'original.jpg'); if (c.blob !== m.original){ m.original = new File([c.blob], c.nombre, {type:'image/jpeg'}); cambio = true; } }
  if (cambio) await msgPut(m);
  return cambio;
}
async function comprimirTodas(){

  if (!fotos.length){ toast('Las fotos ya están comprimidas.'); return; }
  let antes = 0, despues = 0, i = 0;
  for (const m of fotos){

  }

}

// Las letras estándar del PDF no traen flechas ni emojis
const limpio = s => String(s ?? '').replace(/→/g, '-').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/[–—]/g, '-').replace(/[^\x09\x0A\x0D\x20-\xFF]/g, '');
async function fotoParaPdf(blob, lado = 1000){
  const bm = await createImageBitmap(blob); const k = Math.min(1, lado/Math.max(bm.width, bm.height));
  const c = document.createElement('canvas'); c.width = Math.round(bm.width*k); c.height = Math.round(bm.height*k);
  c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height); if (bm.close) bm.close();
  return {url: c.toDataURL('image/jpeg', .75), w: c.width, h: c.height};

// Motor común de los PDF del teléfono (A4, márgenes de 14 mm, letras estándar)
function motorPdf(JsPDF){
  const doc = new JsPDF({unit: 'mm', format: 'a4'}), W = 210, H = 297, M = 14, AN = W - 2*M, z = {y: M};
  const salto = alto => { if (z.y + alto > H - M - 6){ doc.addPage(); z.y = M; } };
  const texto = (t, x, tam, estilo = 'normal', color = [31, 35, 40], ancho = AN) => {
    doc.setFont('helvetica', estilo); doc.setFontSize(tam); doc.setTextColor(...color);
    const l = doc.splitTextToSize(limpio(t), ancho), alto = l.length * tam * .42;
    salto(alto); doc.text(l, x, z.y + tam * .35); z.y += alto; return alto;
  };

// Hoja para mandar, ver o guardar un PDF armado en el teléfono
function mostrarPdf(blob, nombre, titulo, sub, para){
  const file = new File([blob], nombre.replace(/[\\/:*?"<>|]/g, '-'), {type: 'application/pdf'});
  const puede = navigator.canShare && navigator.canShare({files: [file]});
  // Armar el PDF tarda: el teléfono pide un toque nuevo para abrir el menú de compartir
  hoja(`<h3>${esc(titulo)}</h3><p>${esc(sub)} · ${(blob.size/1048576).toFixed(1)} MB</p>
    ${puede ? `<button class="op" data-a="comp">${ic('subir')}<div>Enviar<small>${esc(para)}</small></div></button>` : ''}
    <button class="op" data-a="ver">${ic('imagen')}<div>Ver el PDF</div></button>
    <button class="op" data-a="desc">${ic('bajar')}<div>Guardar en Descargas</div></button>`, h => {
    const c = h.querySelector('[data-a=comp]');
    if (c) c.onclick = async () => { try { await navigator.share({files: [file]}); cerrarHoja(); } catch(e){ if (e.name !== 'AbortError') toast('No se pudo compartir: ' + e.message, 4000); } };
    h.querySelector('[data-a=ver]').onclick = () => { const u = URL.createObjectURL(file); window.open(u, '_blank'); setTimeout(() => URL.revokeObjectURL(u), 120000); };
    h.querySelector('[data-a=desc]').onclick = () => { const u = URL.createObjectURL(file), a = document.createElement('a'); a.href = u; a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000); cerrarHoja(); toast('Guardado en Descargas.'); };
  });
}

let REC = null;   // {base: Blob, rot: 0..3, c: [x, y, w, h] normalizado sobre la imagen ya girada, url}
async function girarBlob(blob, rot, lado = 1600){
  const bm = await createImageBitmap(blob), k = Math.min(1, lado / Math.max(bm.width, bm.height));
  const w = Math.round(bm.width*k), h = Math.round(bm.height*k), r = ((rot % 4) + 4) % 4;
  const c = document.createElement('canvas'); c.width = r % 2 ? h : w; c.height = r % 2 ? w : h;
  const g = c.getContext('2d'); g.translate(c.width/2, c.height/2); g.rotate(r * Math.PI/2); g.drawImage(bm, -w/2, -h/2, w, h); if (bm.close) bm.close();
  return c;
}

(() => {   // arrastrar las esquinas para recortar, o el centro para mover el recuadro
  const R = $('#recorte'); let modo = null, p0 = null, c0 = null;
  const pos = e => { const r = $('#lienzoEd').getBoundingClientRect(); return [(e.clientX - r.left)/r.width, (e.clientY - r.top)/r.height]; };
  R.addEventListener('pointerdown', e => {
    if (!REC) return; e.stopPropagation(); R.setPointerCapture(e.pointerId);
    const esq = e.target.closest('[data-c]'), [x, y] = pos(e), c = REC.c;
    modo = esq ? esq.dataset.c : (x >= c[0] && x <= c[0] + c[2] && y >= c[1] && y <= c[1] + c[3] ? 'mover' : null);
    p0 = [x, y]; c0 = [...c];
  });
  R.addEventListener('pointermove', e => {
    if (!REC || !modo) return;
    const [px, py] = pos(e), dx = px - p0[0], dy = py - p0[1], MIN = .08; let [x, y, w, h] = c0;
    if (modo === 'mover'){ x = Math.min(1 - w, Math.max(0, x + dx)); y = Math.min(1 - h, Math.max(0, y + dy)); }
    else {
      if (modo.includes('w')){ const nx = Math.min(x + w - MIN, Math.max(0, x + dx)); w += x - nx; x = nx; }
      if (modo.includes('e')) w = Math.min(1 - x, Math.max(MIN, w + dx));
      if (modo.includes('n')){ const ny = Math.min(y + h - MIN, Math.max(0, y + dy)); h += y - ny; y = ny; }
      if (modo.includes('s')) h = Math.min(1 - y, Math.max(MIN, h + dy));
    }
    REC.c = [x, y, w, h]; pintarCaja();
  });
  const fin = () => { modo = null; };
  R.addEventListener('pointerup', fin); R.addEventListener('pointercancel', fin);
})();
$('#edRecortar').onclick = abrirRecorte;
$('#recGirar').onclick = async () => { const [x, y, w, h] = REC.c; REC.c = [1 - y - h, x, h, w]; REC.rot = (REC.rot + 1) % 4; await vistaRecorte(); };
$('#recReset').onclick = async () => { REC.rot = 0; REC.c = [0, 0, 1, 1]; await vistaRecorte(); };
$('#recCancel').onclick = cerrarRecorte;
$('#recListo').onclick = aplicarRecorte;
$('#edRecortar').innerHTML = ic('recortar'); $('#recGirar').innerHTML = ic('girar') + 'Girar';

// ---------- Reasignar una acción (toque largo) y mandársela a la persona nueva ----------
// Los cambios quedan en el teléfono (planAsign) y viajan en el zip; el próximo plan de la PC los respeta.
let ASIGN = {ids: {}, personas: []};
async function cargarAsign(){
  ASIGN = (await kvGet('planAsign')) || {ids: {}, personas: []}; ASIGN.ids = ASIGN.ids || {}; ASIGN.personas = ASIGN.personas || [];
  for (const x of ASIGN.personas) if (!P.plan.personas.find(p => p.id === x.id)) P.plan.personas.push(x);
  for (const a of P.plan.actividades){ if (a._resp0 === undefined) a._resp0 = a.responsable; a.responsable = ASIGN.ids[a.id] || a._resp0; }
}
async function copiarAlPortapapeles(txt){
  try { await navigator.clipboard.writeText(txt); return true; } catch(e){}
  const t = document.createElement('textarea'); t.value = txt; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t);
  t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch(e){} t.remove(); return ok;
}
function textoUna(a, per){
  return [`Hola ${per.nombre.split(' ')[0]}, te toca esta acción de la obra ${P.titulo}:`, '',
    `${AREAS[a.area] ? AREAS[a.area].nombre + ': ' : ''}${a.titulo}${a.prioridad === 'alta' ? ' ⚠ prioridad' : ''}`,
    ...(a.detalle ? [a.detalle] : []), ...(a.criterio ? ['Cómo se recibe: ' + a.criterio] : []), '',
    'Cuando termines, mándame una foto. Cualquier duda me escribes.'].join('\n');
}
function reasignar(id){
  const a = P.plan.actividades.find(x => x.id === id); if (!a) return;
  const otras = P.plan.personas.filter(p => p.id !== a.responsable);
  hoja(`<h3>${esc(a.id)} · ${esc(a.titulo)}</h3><p>La tiene <b>${esc(nomPer(a.responsable))}</b>. ¿A quién se la pasas?</p>` +
    otras.map(p => `<button class="op" data-p="${esc(p.id)}"><div class="av" style="width:36px;height:36px;font-size:13px">${esc(iniciales(p.nombre))}</div><div>${esc(p.nombre)}<small>${esc(p.oficio || '')}</small></div></button>`).join('') +
    `<button class="op" data-otra="1">${ic('plus')}<div>Otra persona…<small>Que no está en la lista</small></div></button>`, h => {
    h.querySelectorAll('[data-p]').forEach(b => b.onclick = () => asignar(a, b.dataset.p));
    h.querySelector('[data-otra]').onclick = async () => {
      const n = (prompt('Nombre de la persona:') || '').trim(); if (!n) return;
      const o = (prompt('Oficio (opcional):') || '').trim();
      const pid = 'extra-' + n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      const x = {id: pid, nombre: n, oficio: o, telefono: ''};
      if (!ASIGN.personas.find(p => p.id === pid)) ASIGN.personas.push(x);
      if (!P.plan.personas.find(p => p.id === pid)) P.plan.personas.push(x);
      await asignar(a, pid);
    };
  });
}
async function asignar(a, pid){
  const antes = nomPer(a.responsable);
  if (pid === a._resp0) delete ASIGN.ids[a.id]; else ASIGN.ids[a.id] = pid;
  a.responsable = pid; await kvSet('planAsign', ASIGN); vibrar(20);
  await pintarPlan(true);
  const per = P.plan.personas.find(p => p.id === pid), nom = per.nombre.split(' ')[0];
  hoja(`<h3>Ahora la tiene ${esc(per.nombre)}</h3><p>${esc(a.titulo)} · antes: ${esc(antes)}</p>
    <button class="op" data-a="txt">${ic('copiar')}<div>Copiar mensaje para ${esc(nom)}<small>Solo esta acción, para pegar en su chat</small></div></button>
    <button class="op" data-a="pdf">${ic('subir')}<div>Enviar su PDF<small>Su lista completa de pendientes, con fotos</small></div></button>
    <button class="op" data-a="no">${ic('check')}<div>Listo, no enviar ahora</div></button>`, h => {
    h.querySelector('[data-a=txt]').onclick = async () => { const ok = await copiarAlPortapapeles(textoUna(a, per)); cerrarHoja(); toast(ok ? `Copiado. Pégalo en el chat de ${nom}.` : 'No se pudo copiar.', 3500); };
    h.querySelector('[data-a=pdf]').onclick = () => { cerrarHoja(); enviarPDF(pid); };
    h.querySelector('[data-a=no]').onclick = cerrarHoja;
  });
}
let largoPlan = false;
(() => {   // toque largo sobre una acción = reasignar
  const L = $('#lista'); let t = null, x0 = 0, y0 = 0;
  L.addEventListener('pointerdown', e => {
    if (tab !== 'plan') return; const act = e.target.closest('.pact'); if (!act || e.target.closest('.chk')) return;
    x0 = e.clientX; y0 = e.clientY; largoPlan = false;
    t = setTimeout(() => { largoPlan = true; vibrar(30); reasignar(act.dataset.id); }, 550);
  });
  const no = () => clearTimeout(t);
  L.addEventListener('pointermove', e => { if (Math.abs(e.clientX - x0) + Math.abs(e.clientY - y0) > 10) no(); });
  L.addEventListener('pointerup', no); L.addEventListener('pointercancel', no);
  L.addEventListener('contextmenu', e => { if (tab === 'plan' && e.target.closest('.pact')) e.preventDefault(); });
})();

// ---------- Tema claro / oscuro (automático: el del teléfono) ----------
const TEMAS = ['auto', 'claro', 'oscuro'];
function temaActual(){ try { return localStorage.getItem('tema') || 'auto'; } catch(e){ return 'auto'; } }
function aplicarTema(t){ const r = document.documentElement; if (t === 'claro') r.dataset.theme = 'light'; else if (t === 'oscuro') r.dataset.theme = 'dark'; else delete r.dataset.theme; }

  <button class="op" data-a="star">${ic('estrella')}Destacados de esta área</button>
  <button class="op" data-a="gal">${ic('imagen')}Elegir varias fotos de la galería</button>
  <button class="op" data-a="aud">${ic('audio')}Adjuntar un audio (de WhatsApp o la grabadora)</button>`, h => {
  h.querySelector('[data-a=star]').onclick = async () => verDestacados(await msgsTodos(), abierta);
  h.querySelector('[data-a=gal]').onclick = () => { cerrarHoja(); $('#inGal').click(); };
  h.querySelector('[data-a=aud]').onclick = () => { cerrarHoja(); $('#inAud').click(); };
});
pintarAccion();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
(async () => {
  try { await abrirDB(); } catch(e){ $('#errClave').textContent = 'Este navegador no deja guardar datos. Usa Chrome normal (no incógnito).'; return; }
  P = await kvGet('payload2');
  if (P) await arrancar(); else $('#clave').focus();
})();
</script>
