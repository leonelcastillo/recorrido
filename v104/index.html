<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#202c33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Recorrido de obra</title>
<style>
:root{
  --bg:#0b141a; --panel:#111b21; --head:#202c33; --out:#005c4b; --ink:#e9edef; --muted:#8696a0;
  --accent:#00a884; --line:#222d34; --pend:#f0913a; --listo:#25d366; --sin:#53bdeb; --danger:#f15c6d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,Roboto,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
[hidden]{display:none!important}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pantalla{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.top{background:var(--head);display:flex;align-items:center;gap:6px;padding:8px 6px 8px 14px;padding-top:calc(8px + env(safe-area-inset-top));min-height:58px;flex:none}
.top h1{font-size:20px;font-weight:600;flex:1;margin:0}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.ib:active{background:#ffffff1a}
.tabs{display:flex;background:var(--head);flex:none;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;padding:12px 12px 9px;color:var(--muted);font-weight:600;font-size:14px;border-bottom:3px solid transparent;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* Candado */
#candado{align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px}
#candado .logo{width:84px;height:84px;border-radius:24px;background:var(--accent);display:grid;place-items:center;color:#0b141a}
#candado .logo svg{width:46px;height:46px}
#candado p{color:var(--muted);max-width:320px;margin:0}
#candado input{width:100%;max-width:320px;background:var(--head);border:1px solid var(--line);border-radius:24px;padding:13px 18px;outline:none;text-align:center}
.boton{background:var(--accent);color:#0b141a;font-weight:700;border-radius:24px;padding:12px 26px}

/* Plano */
#planoWrap{margin:10px;border-radius:12px;overflow-x:auto;overflow-y:hidden;background:#1c1c1c;scrollbar-width:thin}
.lienzo{position:relative}
.lienzo img{width:100%;display:block;filter:invert(.89) hue-rotate(180deg);user-select:none;-webkit-user-drag:none}
#planoWrap svg{position:absolute;inset:0;width:100%;height:100%}
.area polygon{stroke-width:5;stroke-linejoin:round}
.area.sin polygon{fill:rgba(83,189,235,.05);stroke:rgba(83,189,235,.55);stroke-dasharray:16 10}
.area.tocada polygon{fill:rgba(83,189,235,.2);stroke:var(--sin)}
.area.pend polygon{fill:rgba(240,145,58,.28);stroke:var(--pend)}
.area.listo polygon{fill:rgba(37,211,102,.25);stroke:var(--listo)}
.area:active polygon{fill:rgba(0,168,132,.45)}
.area text{pointer-events:none;font-weight:800;fill:#fff;paint-order:stroke;stroke:#000;stroke-width:8px}
.leyenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 14px 6px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}

/* Lista estilo chats */
.fila{display:flex;align-items:center;gap:13px;padding:0 14px;width:100%;text-align:left}
.fila:active{background:#ffffff0d}
.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:16px;background:#2a3942}
.av.tocada{background:#1d6d8c}.av.pend{background:var(--pend)}.av.listo{background:#1fa855}
.fila .txt{flex:1;min-width:0;border-bottom:1px solid var(--line);padding:13px 0}
.fila .l1,.fila .l2{display:flex;align-items:center;gap:8px}
.fila .nom{flex:1;font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .hr{font-size:12px;color:var(--muted)}
.fila .prev{flex:1;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.fila .prev svg{width:16px;height:16px}
.badge{background:var(--accent);color:#0b141a;border-radius:12px;min-width:21px;height:21px;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.seccion{color:var(--muted);font-size:13px;padding:14px 14px 4px;font-weight:600}

/* Chat */
#chat .top{gap:4px;padding-left:4px}
#chat .av{width:40px;height:40px;font-size:14px}
.titulo{flex:1;min-width:0;margin-left:6px}
.titulo b{display:block;font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titulo small{color:var(--muted);font-size:13px}
#selTop b{flex:1;font-size:20px;font-weight:500;margin-left:10px}
#estados{display:flex;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
#estados button{flex:1;border:1px solid var(--line);border-radius:18px;padding:6px 4px;font-size:13px;color:var(--muted)}
#estados button.on[data-e=sin]{background:#1d6d8c;color:#fff;border-color:#1d6d8c}
#estados button.on[data-e=pend]{background:var(--pend);color:#111;border-color:var(--pend)}
#estados button.on[data-e=listo]{background:#1fa855;color:#fff;border-color:#1fa855}
#mensajes{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 10px 10px;display:flex;flex-direction:column;
  background-color:var(--bg);background-image:radial-gradient(#ffffff08 1px,transparent 1px);background-size:22px 22px}
.dia{align-self:center;background:#182229;color:var(--muted);font-size:12.5px;padding:5px 12px;border-radius:8px;margin:10px 0 6px;text-transform:uppercase}
.vacioChat{align-self:center;background:#182229;color:#ffd279;font-size:13px;padding:8px 12px;border-radius:8px;margin:14px 10px;text-align:center;max-width:320px}
.b{max-width:82%;align-self:flex-end;background:var(--out);border-radius:8px 0 8px 8px;padding:6px 8px 5px 9px;margin:3px 0;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.b.cont{border-radius:8px;margin-top:1px}
.b.sel::before{content:'';position:absolute;top:-2px;bottom:-2px;left:-100vw;right:-100vw;background:#00a88440;pointer-events:none}
.b.flash{animation:flash 1.3s}
@keyframes flash{0%,60%{filter:brightness(1.7)}}
.b img,.b video{-webkit-user-drag:none;pointer-events:none}
.b .t{white-space:pre-wrap;word-wrap:break-word}
.reenv{font-size:12px;color:#ffffff99;font-style:italic;display:flex;align-items:center;gap:4px;margin-bottom:2px}
.reenv svg{width:14px;height:14px}
.cita{display:flex;background:#0000002e;border-radius:6px;overflow:hidden;margin:0 -3px 4px -4px;min-width:150px}
.cita::before{content:'';width:4px;background:#53bdeb;flex:none}
.cita div{flex:1;min-width:0;padding:5px 8px}
.cita b{display:block;font-size:13px;color:#53bdeb;font-weight:600}
.cita span{display:block;font-size:13.5px;color:#ffffffb3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cita img{width:46px;height:46px;object-fit:cover;flex:none}
.hora{float:right;font-size:11px;color:#ffffff99;margin:7px 0 -5px 10px;display:flex;align-items:center;gap:3px;white-space:nowrap}
.hora svg{width:16px;height:16px;stroke-width:2.2}
.hora .ok{color:#53bdeb;display:flex}
.hora .st svg{width:11px;height:11px;fill:currentColor;stroke:none}
.b.media{padding:3px}
.b.media .cita,.b.media .reenv{margin:3px 3px 4px}
.b.media .marco{position:relative}
.b.media .img{display:block;width:min(260px,68vw);min-height:120px;max-height:360px;object-fit:cover;border-radius:6px;background:#0d3a33}
.b.media .marco .hora{position:absolute;right:6px;bottom:4px;margin:0;color:#fff;text-shadow:0 0 4px #000}
.b.media .pie{padding:5px 5px 2px 6px;max-width:min(260px,68vw)}
.b.media .play{position:absolute;inset:0;display:grid;place-items:center}
.b.media .play span{width:54px;height:54px;border-radius:50%;background:#0009;display:grid;place-items:center}
.b.media .play svg{fill:#fff;stroke:none;width:26px;height:26px;margin-left:3px}
.aud{display:flex;align-items:center;gap:10px;width:min(250px,64vw);padding:2px 0}
.aud .pb{width:36px;height:36px;display:grid;place-items:center;flex:none}
.aud .pb svg{fill:var(--ink);stroke:none;width:26px;height:26px}
.aud .barra{flex:1;height:4px;border-radius:2px;background:#ffffff40;position:relative}
.aud .barra i{position:absolute;left:0;top:0;bottom:0;background:#53bdeb;border-radius:2px;width:0}
.aud .barra b{position:absolute;top:-5px;width:13px;height:13px;border-radius:50%;background:#53bdeb;left:-6px}
.aud .mic{width:40px;height:40px;border-radius:50%;background:#2a3942;display:grid;place-items:center;flex:none;color:#53bdeb}
.aud .mic svg{width:20px;height:20px}
.aud-pie{display:flex;justify-content:space-between;font-size:11px;color:#ffffff99;margin:2px 0 0 46px}

/* Composer */
#contexto{display:flex;align-items:center;gap:8px;margin:0 62px 0 6px;background:var(--head);border-radius:14px 14px 0 0;padding:7px 4px 4px 7px;flex:none}
#contexto .cita{flex:1;margin:0;background:#0b141a99;min-width:0}
#contexto .ib{width:34px;height:34px;color:var(--muted)}
#contexto:not([hidden]) + #composer .caja{border-radius:0 0 22px 22px}
#composer{display:flex;align-items:flex-end;gap:6px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));flex:none}
#contexto:not([hidden]) + #composer{padding-top:0}
.caja{flex:1;display:flex;align-items:flex-end;background:var(--head);border-radius:25px;min-height:50px;padding:0 4px 0 16px}
.caja textarea{flex:1;background:none;border:0;resize:none;max-height:130px;padding:13px 0;outline:none;line-height:1.35;height:48px}
.caja .ib{color:var(--muted);height:48px;width:44px}
.redondo{width:50px;height:50px;border-radius:50%;background:var(--accent);color:#0b141a;display:grid;place-items:center;flex:none}
.redondo:active{filter:brightness(1.15)}
#grabando{flex:1;display:flex;align-items:center;gap:12px;background:var(--head);border-radius:25px;min-height:50px;padding:0 8px 0 6px}
#grabando .punto{width:11px;height:11px;border-radius:50%;background:var(--danger);animation:late 1s infinite}
#grabando .tiempo{font-variant-numeric:tabular-nums;font-size:17px}
#grabando .msg{flex:1;color:var(--muted);font-size:14px}
#grabando .ib{color:var(--danger)}
@keyframes late{50%{opacity:.2}}

/* Cámara de varias fotos */
#camara{position:fixed;inset:0;background:#000;z-index:33;display:flex;flex-direction:column}
#camara video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.topCam{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;z-index:2}
.topCam .ib{background:#0006;color:#fff}
.barraCam{display:flex;align-items:center;justify-content:space-between;padding:18px 28px calc(24px + env(safe-area-inset-bottom));background:#000}
#disparo{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:#ffffff2e}
#disparo:active{background:#fff}
#camUltima{width:54px;height:54px;border-radius:10px;position:relative;background:#222;border:2px solid #fff}
#camUltima img{width:100%;height:100%;object-fit:cover;border-radius:8px}
#camUltima span{position:absolute;top:-9px;right:-9px;background:var(--accent);color:#0b141a;border-radius:11px;min-width:22px;height:22px;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
#camListo{width:54px;height:54px;border-radius:50%;background:var(--accent);color:#0b141a;display:grid;place-items:center}
#camFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

/* Editor de fotos */
#editor{position:fixed;inset:0;background:#000;z-index:31;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
.topEd{display:flex;align-items:center;gap:2px;padding:calc(6px + env(safe-area-inset-top)) 6px 6px;flex:none}
.topEd .ib{color:#fff}
.topEd .ib.on{background:#ffffff33}
.topEd .sp{flex:1}
#escena{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#lienzoEd{position:relative;flex:none}
#medioEd,#medioEd img,#medioEd video{display:block;width:100%;height:100%}
#medioEd img{-webkit-user-drag:none;pointer-events:none}
#trazos{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#capas{position:absolute;inset:0}
#editor.lapiz #trazos{pointer-events:auto}
#editor.lapiz #capas{pointer-events:none}
.capa{position:absolute;left:0;top:0;white-space:pre;font-weight:800;line-height:1.15;text-align:center;font-family:system-ui,Roboto,"Segoe UI",sans-serif;cursor:move}
.capa.texto{text-shadow:0 0 .12em rgba(0,0,0,.6)}
.capa.etiqueta{padding:.25em .6em;border-radius:.5em}
.capa.sel{outline:2px dashed #ffffffcc;outline-offset:6px}
.capa .x{position:absolute;top:-17px;right:-17px;width:26px;height:26px;border-radius:50%;background:var(--danger);color:#fff;font:700 18px/1 system-ui;display:none;place-items:center;text-shadow:none;padding:0}
.capa.sel .x{display:grid}
#paleta{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;z-index:6}
#paleta button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 4px #0008}
#paleta button.on{transform:scale(1.35)}
#miniaturas{display:flex;gap:6px;overflow-x:auto;padding:6px 8px 2px;flex:none;touch-action:pan-x;scrollbar-width:none}
#miniaturas button{width:52px;height:52px;border-radius:6px;overflow:hidden;flex:none;border:2px solid transparent;position:relative;background:#222}
#miniaturas button.on{border-color:var(--accent)}
#miniaturas img,#miniaturas video{width:100%;height:100%;object-fit:cover;pointer-events:none}
#miniaturas i{position:absolute;right:3px;bottom:3px;width:9px;height:9px;border-radius:50%;background:#ffcc00;border:1px solid #000}
#miniaturas .mas{display:grid;place-items:center;color:#fff;border:1.5px dashed #ffffff88;background:none}
#todasPie{padding:2px 14px 0;flex:none}
#todasPie button{font-size:13px;color:#53bdeb;padding:4px 0}
#pieEd{display:flex;align-items:flex-end;gap:6px;padding:6px 6px calc(8px + env(safe-area-inset-bottom));flex:none}
#pieEd .caja{background:#1f2c33}
#escribir{position:absolute;inset:0;background:#000c;z-index:5;display:flex;flex-direction:column}
#escribir textarea{flex:1;background:none;border:0;outline:none;text-align:center;font:800 32px/1.2 system-ui,Roboto,sans-serif;resize:none;padding:28vh 50px 0 20px;width:100%}
.gridSt{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:4px 12px 12px}
.gridSt button{font-size:32px;padding:6px 0;border-radius:10px}
.gridSt button:active{background:#ffffff14}
.gridEt{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 14px}
.gridEt button{padding:9px 14px;border-radius:10px;color:#fff;font-weight:700}
#visor .ib.on{background:#ffffff33}

/* Plan de culminación */
.planCab{margin:12px;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.planCab h2{margin:0;font-size:18px}
.planCab .sub{color:var(--muted);font-size:13px;margin-top:4px}
.prog{height:6px;border-radius:3px;background:#2a3942;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.segm{display:flex;margin:4px 12px 8px;background:var(--panel);border-radius:10px;padding:3px;border:1px solid var(--line)}
.segm button{flex:1;padding:9px 0;border-radius:8px;font-size:14px;color:var(--muted)}
.segm button.on{background:var(--head);color:var(--ink);font-weight:600}
details.blq{margin:6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.blq.sub{margin:0;border:0;border-top:1px solid var(--line);border-radius:0;background:#0d171d}
details.blq>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 12px 12px 14px;cursor:pointer}
details.blq>summary::-webkit-details-marker{display:none}
details.blq.sub>summary{padding-left:18px}
summary .st{flex:1;min-width:0}
summary .st b{font-weight:600;display:block}
summary .st small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
summary .flecha{color:var(--muted);transition:transform .15s;display:grid}
summary .flecha svg{width:20px;height:20px}
details[open]>summary .flecha{transform:rotate(90deg)}
.hoyChip{background:var(--accent);color:#0b141a;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;vertical-align:1px}
.pdn{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.pd{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.pd.alta{background:#f15c6d}.pd.media{background:var(--pend)}.pd.baja{background:#8696a0}
.pbody{padding:2px 14px 12px;font-size:14px}
.pbody p{margin:8px 0}
.pbody .aviso{color:#ffd279}
.pbody .res{color:var(--muted)}
.pact{display:flex;gap:10px;padding:10px 12px 10px 14px;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer}
.pact .chk{width:26px;height:26px;border-radius:7px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;margin-top:1px}
.pact .chk svg{width:18px;height:18px;stroke-width:3}
.pact .chk.on{background:var(--accent);border-color:var(--accent);color:#0b141a}
.pact .cuerpo{flex:1;min-width:0}
.pact .t{font-size:15px;line-height:1.3}
.pact.hecha .t{text-decoration:line-through;color:var(--muted)}
.pact .m{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.pact .cod{color:var(--accent);font-weight:700}
.pdet{display:none;margin-top:8px;font-size:14px;line-height:1.4}
.pact.abierta .pdet{display:block}
.pdet .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:9px}
.minis{display:flex;gap:6px;margin-top:9px;overflow-x:auto}
.minis img{width:86px;height:86px;object-fit:cover;border-radius:8px;flex:none;background:#2a3942}
.btnWa{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 14px 10px;padding:10px;border-radius:22px;background:#25d366;color:#0b141a;font-weight:700;width:calc(100% - 28px)}
.btnWa svg{width:18px;height:18px}

/* Hoja inferior, visor, toast */
#fondo{position:fixed;inset:0;background:#0008;z-index:34}
#hoja{position:fixed;left:0;right:0;bottom:0;background:var(--head);border-radius:18px 18px 0 0;z-index:35;padding:8px 0 calc(12px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;animation:sube .18s ease-out}
@keyframes sube{from{transform:translateY(40px);opacity:.4}}
#hoja .tira{width:36px;height:4px;border-radius:2px;background:#ffffff33;margin:4px auto 10px}
#hoja h3{margin:4px 20px 10px;font-size:16px}
#hoja p{margin:0 20px 12px;color:var(--muted);font-size:14px}
.op{display:flex;align-items:center;gap:18px;width:100%;padding:14px 22px;text-align:left;font-size:16px}
.op:active{background:#ffffff0d}
.op svg{color:var(--muted)}
.op.rojo,.op.rojo svg{color:var(--danger)}
.op small{display:block;color:var(--muted);font-size:13px}
.op .mini{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none;background:#2a3942;display:grid;place-items:center}
.op .cuerpo{flex:1;min-width:0}
.op .cuerpo span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gridOps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 14px 10px}
.gridOps button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:8px 0}
.gridOps span{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff}
#visor{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}

</style>

<body>

<!-- Candado: los planos vienen cifrados -->
<section id="candado" class="pantalla">
  <div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></div>
  <h2 style="margin:0">Recorrido de obra</h2>
  <p>Escribe la clave para abrir los planos. Solo se pide la primera vez en este teléfono.</p>
  <input id="clave" type="password" placeholder="Clave" autocomplete="current-password">
  <button id="btnAbrir" class="boton">Abrir</button>
  <p id="errClave" style="color:var(--danger)"></p>
</section>

<!-- Inicio: plano + lista de áreas -->
<section id="inicio" class="pantalla" hidden>
  <header class="top"><h1 id="titulo">Recorrido</h1>
    <button class="ib" id="btnMenu" aria-label="Menú"></button></header>
  <nav class="tabs" id="tabs"></nav>
  <div class="scroll" id="scrollInicio">
    <div id="planoWrap"></div>
    <div class="leyenda" id="leyenda"></div>
    <div id="lista"></div>
  </div>
</section>

<!-- Chat de un área -->
<section id="chat" class="pantalla" hidden>
  <header class="top" id="chatTop">
    <button class="ib" id="btnAtras" aria-label="Atrás"></button>
    <div class="av" id="chatAv"></div>
    <div class="titulo"><b id="chatNombre"></b><small id="chatSub"></small></div>
    <button class="ib" id="btnChatMenu" aria-label="Opciones"></button>
  </header>
  <header class="top" id="selTop" hidden>
    <button class="ib" id="sCerrar" aria-label="Cancelar selección"></button>
    <b id="sCuenta">1</b>
    <button class="ib" id="sResp" aria-label="Responder"></button>
    <button class="ib" id="sStar" aria-label="Destacar"></button>
    <button class="ib" id="sDel" aria-label="Borrar"></button>
    <button class="ib" id="sFwd" aria-label="Reenviar"></button>
    <button class="ib" id="sMas" aria-label="Más"></button>
  </header>
  <div id="estados"></div>
  <div id="mensajes"></div>
  <div id="contexto" hidden></div>
  <footer id="composer">
    <div class="caja" id="caja">
      <textarea id="texto" rows="1" placeholder="Mensaje"></textarea>
      <button class="ib" id="btnClip" aria-label="Adjuntar"></button>
      <button class="ib" id="btnCam" aria-label="Cámara"></button>
    </div>
    <div id="grabando" hidden>
      <button class="ib" id="btnDescartar" aria-label="Descartar"></button>
      <span class="punto"></span><span class="tiempo" id="recTiempo">0:00</span>

<div id="fondo" hidden></div>
<div id="hoja" hidden></div>
<div id="visor" hidden>
  <header class="top"><button class="ib" id="vAtras"></button>
    <div class="titulo"><b id="vTitulo"></b><small id="vSub"></small></div>
    <button class="ib" id="vOrig" aria-label="Ver original" hidden></button><button class="ib" id="vStar"></button><button class="ib" id="vBorrar"></button></header>
  <div class="medio" id="vMedio"></div>

</div>

  <div class="topCam"><button class="ib" id="camCerrar" aria-label="Cerrar cámara"></button><button class="ib" id="camGirar" aria-label="Cambiar cámara"></button></div>
  <video id="camVideo" autoplay playsinline muted></video>
  <div id="camFlash"></div>

</div>

  <div class="topEd"><button class="ib" id="edCerrar" aria-label="Descartar"></button><span class="sp"></span>
    <button class="ib" id="edDeshacer" aria-label="Deshacer trazo" hidden></button>
    <button class="ib" id="edQuitar" aria-label="Quitar esta foto"></button>
    <button class="ib" id="edSticker" aria-label="Stickers"></button>
    <button class="ib" id="edEtiq" aria-label="Etiquetas"></button>
    <button class="ib" id="edTexto" aria-label="Texto"></button>
    <button class="ib" id="edLapiz" aria-label="Lápiz"></button></div>
  <div id="escena"><div id="lienzoEd"><div id="medioEd"></div><canvas id="trazos"></canvas><div id="capas"></div></div></div>
  <div id="paleta" hidden></div>
  <div id="escribir" hidden><div class="topEd"><span class="sp"></span><button class="boton" id="escListo">Listo</button></div><textarea id="escTexto" rows="3" placeholder="Escribe…"></textarea></div>
  <div id="miniaturas"></div>
  <div id="todasPie" hidden><button id="btnTodasPie">Usar este comentario en todas</button></div>
  <div id="pieEd"><div class="caja"><textarea id="pieTexto" rows="1" placeholder="Añade un comentario…"></textarea></div><button class="redondo" id="edEnviar" aria-label="Enviar"></button></div>
</div>

<input type="file" id="inCam" accept="image/*" capture="environment" hidden>
<input type="file" id="inGal" accept="image/*,video/*" multiple hidden>
<input type="file" id="inAud" accept="audio/*" multiple hidden>

<script>
'use strict';
const DB_NOMBRE = 'recorrido-obra-v104';
// ---------- Iconos ----------
const IC = {
  mas:'<circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/>',
  atras:'<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
  cerrar:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  clip:'<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
  cam:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  mic:'<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>',
  enviar:'<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
  basura:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>',
  imagen:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
  video:'<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/>',
  audio:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  doble:'<polyline points="18 6 7 17 2 12"/><polyline points="22 6 11 17 10 16"/>',
  mover:'<polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  subir:'<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>',
  bajar:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  disco:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>',
  candado:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  play:'<polygon points="6 3 20 12 6 21 6 3"/>',
  pausa:'<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
  responder:'<polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/>',
  reenviar:'<polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/>',
  estrella:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  lapiz:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  copiar:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  etiqueta:'<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>',
  letra:'<polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/>',
  carita:'<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>',
  girar:'<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
  deshacer:'<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>',
  chev:'<polyline points="9 18 15 12 9 6"/>',
  lista:'<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
};
const ic = (n, extra='') => `<svg class="i" viewBox="0 0 24 24" ${extra}>${IC[n]}</svg>`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vibrar = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };

// ---------- Base de datos del teléfono (IndexedDB) ----------
let DB;
const req = r => new Promise((ok, mal) => { r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error); });
function abrirDB(){
  return new Promise((ok, mal) => {
    const r = indexedDB.open(DB_NOMBRE, 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('msgs', {keyPath:'id'}).createIndex('area','area'); d.createObjectStore('kv'); };
    r.onsuccess = () => ok(DB = r.result); r.onerror = () => mal(r.error);
  });
}
const st = (s, m='readonly') => DB.transaction(s, m).objectStore(s);
const kvGet = k => req(st('kv').get(k));
const kvSet = (k, v) => req(st('kv','readwrite').put(v, k));
const msgPut = m => req(st('msgs','readwrite').put(m));
const msgDel = id => req(st('msgs','readwrite').delete(id));
const msgsDe = a => req(st('msgs').index('area').getAll(a));
const msgsTodos = () => req(st('msgs').getAll());

// ---------- Estado de la app ----------
let P = null;               // datos descifrados: niveles, áreas
const AREAS = {};           // id -> {id,nivel,nombre,carpeta}
const NIVELES = {gen:'Generales'};
let ESTADOS = {};           // id -> 'sin'|'pend'|'listo'
let RES = {};               // id -> {n, nuevos, ultimo}
let tab = null, abierta = null, urls = [];
let MSGS = [];
const selec = new Set();    // mensajes seleccionados (toque largo)
let respondiendo = null, editando = null;

function toast(t, ms=2600){ const e=$('#toast'); e.textContent=t; e.hidden=false; clearTimeout(toast.t); if(ms) toast.t=setTimeout(()=>e.hidden=true, ms); }
const iniciales = n => { const p = n.replace(/[^\p{L}\p{N} ]/gu,'').split(/\s+/).filter(Boolean); return ((p[0]||'')[0] + ((p[1]||'')[0]||'')).toUpperCase(); };
const hora = d => new Date(d).toLocaleTimeString('es-VE', {hour:'numeric', minute:'2-digit'});
function diaTxt(d){
  const f = new Date(d), h = new Date(); const s = x => x.toDateString();
  if (s(f)===s(h)) return 'Hoy';
  const a = new Date(h); a.setDate(h.getDate()-1); if (s(f)===s(a)) return 'Ayer';
  return f.toLocaleDateString('es-VE', {weekday:'long', day:'numeric', month:'long'});
}
function cuandoCorto(d){ const f=new Date(d), h=new Date(); return f.toDateString()===h.toDateString() ? hora(d) : f.toLocaleDateString('es-VE',{day:'2-digit',month:'2-digit'}); }
const mmss = s => { s = Math.max(0, Math.round(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const claseDe = id => { const e = ESTADOS[id]||'sin'; if (e!=='sin') return e; return (RES[id]&&RES[id].n) ? 'tocada' : 'sin'; };
const ptsDe = a => a.pts || [[a.rect[0],a.rect[1]],[a.rect[0]+a.rect[2],a.rect[1]],[a.rect[0]+a.rect[2],a.rect[1]+a.rect[3]],[a.rect[0],a.rect[1]+a.rect[3]]];
const pendiente = m => !m.exportado || m.meta;          // falta mandarlo (o mandar su cambio) a la PC
const tocar = m => { if (m.exportado) m.meta = true; };  // un cambio en algo ya enviado
// Texto corto de un mensaje, para citas y listas
function resumen(m){
  if (!m) return 'Mensaje';
  if (m.tipo==='texto') return m.texto || '';
  const base = m.tipo==='foto' ? 'Foto' : m.tipo==='video' ? 'Video' : 'Audio ' + mmss(m.dur);
  return m.texto ? base + ' · ' + m.texto : base;
}

function prepararAreas(){
  for (const n of P.niveles){ NIVELES[n.id] = n.nombre;
    for (const a of n.areas) AREAS[n.id+'-'+a.id] = {id:n.id+'-'+a.id, nivel:n.id, nombre:a.nombre, carpeta:n.cod+' '+a.nombre}; }
  for (const g of P.generales)
    AREAS['gen-'+g.id] = {id:'gen-'+g.id, nivel:'gen', nombre:g.nombre, carpeta:'GEN '+g.nombre.replace(/[\/\\:*?"<>|]/g,'-')};
  tab = P.niveles[0].id;
}

async function recalcular(){
  RES = {}; for (const id in AREAS) RES[id] = {n:0, nuevos:0, ultimo:null};
  for (const m of await msgsTodos()){
    const r = RES[m.area]; if (!r) continue;
    r.n++; if (pendiente(m)) r.nuevos++;
    if (!r.ultimo || m.fecha > r.ultimo.fecha) r.ultimo = {tipo:m.tipo, texto:m.texto, dur:m.dur, fecha:m.fecha};
  }
}

// ---------- Candado y descifrado ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function descifrar(clave){
  const enc = await (await fetch('planos.enc', {cache:'no-cache'})).json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(enc.salt), iterations:enc.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(enc.iv)}, key, b64(enc.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
$('#btnAbrir').onclick = async () => {
  const c = $('#clave').value.trim(); if (!c) return;
  $('#btnAbrir').textContent = 'Abriendo…';
  try { P = await descifrar(c); await kvSet('payload2', P); await kvSet('clave', c); await arrancar(); }
  catch(e){ $('#errClave').textContent = e.name==='OperationError' ? 'Clave incorrecta.' : 'No pude abrir: ' + e.message; }
  $('#btnAbrir').textContent = 'Abrir';
};
$('#clave').onkeydown = e => { if (e.key==='Enter') $('#btnAbrir').click(); };

async function arrancar(){
  prepararAreas();
  ESTADOS = (await kvGet('estados')) || {};
  await recalcular();
  $('#titulo').textContent = 'Recorrido ' + (P.titulo||'');
  document.title = 'Recorrido ' + (P.titulo||'');
  $('#candado').hidden = true; $('#inicio').hidden = false;
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch(e){}
  pintarInicio();
  refrescarPlanos();
}
// Si hay internet y los planos cambiaron (áreas nuevas), se actualizan solos con la clave guardada.
async function refrescarPlanos(){
  try {
    const c = await kvGet('clave'); if (!c) return;
    const nuevo = await descifrar(c);
    if (JSON.stringify(nuevo) !== JSON.stringify(P)){
      await kvSet('payload2', nuevo);
      const mismos = JSON.stringify([nuevo.niveles, nuevo.generales]) === JSON.stringify([P.niveles, P.generales]);
      const planNuevo = JSON.stringify(nuevo.plan || null) !== JSON.stringify(P.plan || null);
      if (mismos){ P = nuevo; if (!$('#inicio').hidden) pintarInicio(); if (planNuevo && P.plan) toast('Llegó el plan de culminación: pestaña PLAN.', 5000); }
      else toast('Planos actualizados. Cierra y abre la app para verlos.', 5000);
    }
  } catch(e){}
}

// ---------- Inicio ----------
function pintarTabs(){
  const ts = [...P.niveles.map(n => [n.id, n.corto || n.nombre]), ['gen','Generales'], ...(P.plan ? [['plan','Plan']] : [])];
  if (tab === 'plan' && !P.plan) tab = P.niveles[0].id;
  $('#tabs').innerHTML = ts.map(([k,n]) => `<button data-k="${k}" class="${k===tab?'on':''}">${esc(n)}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.k; pintarInicio(); $('#scrollInicio').scrollTop = 0; });
}
function pintarPlano(){
  const w = $('#planoWrap');
  if (tab==='gen' || tab==='plan'){ w.hidden = true; $('#leyenda').hidden = true; return; }
  w.hidden = false; $('#leyenda').hidden = false;
  const p = P.niveles.find(n => n.id===tab), W = p.w, H = p.h, fs = W*0.026;
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  for (const a of p.areas){
    const id = tab+'-'+a.id, pts = ptsDe(a).map(([x,y]) => [x*W/100, y*H/100]), n = RES[id].n;
    const cx = pts.reduce((t,q)=>t+q[0],0)/pts.length, cy = pts.reduce((t,q)=>t+q[1],0)/pts.length;
    s += `<g class="area ${claseDe(id)}" data-id="${id}"><polygon points="${pts.map(q=>q.join(',')).join(' ')}"/>${n?`<text x="${cx}" y="${cy+fs*0.35}" text-anchor="middle" font-size="${fs}">${n}</text>`:''}</g>`;
  }
  const ancho = Math.round(Math.min(1100, Math.max(640, 330*W/H)));
  w.innerHTML = `<div class="lienzo" style="width:max(100%, ${ancho}px)"><img src="${p.img}" alt="">${s}</svg></div>`;
  w.querySelectorAll('g.area').forEach(g => g.onclick = () => abrirChat(g.dataset.id));
  $('#leyenda').innerHTML = `<span style="width:100%">Desliza el plano a los lados para ver toda la planta.</span><span><i style="border:1.5px dashed var(--sin)"></i>Sin revisar</span><span><i style="background:var(--sin)"></i>Con registros</span><span><i style="background:var(--pend)"></i>Pendientes</span><span><i style="background:var(--listo)"></i>Listo</span>`;
}
function prevTxt(u){
  if (!u) return '<span style="opacity:.7">Toca para empezar</span>';
  const pie = u.texto ? ' · ' + esc(u.texto) : '';
  if (u.tipo==='foto') return ic('imagen') + 'Foto' + pie;
  if (u.tipo==='video') return ic('video') + 'Video' + pie;
  if (u.tipo==='audio') return ic('mic','style="color:#53bdeb"') + mmss(u.dur);
  return esc(u.texto);
}
function filaHTML(a){
  const r = RES[a.id], c = claseDe(a.id);
  return `<button class="fila" data-id="${a.id}"><div class="av ${c}">${esc(iniciales(a.nombre))}</div><div class="txt">
    <div class="l1"><span class="nom">${esc(a.nombre)}</span><span class="hr">${r.ultimo?cuandoCorto(r.ultimo.fecha):''}</span></div>
    <div class="l2"><span class="prev">${prevTxt(r.ultimo)}</span>${r.nuevos?`<span class="badge">${r.nuevos}</span>`:''}</div></div></button>`;
}
function pintarLista(){
  if (tab === 'plan') return pintarPlan();

function soltarUrls(){ urls.forEach(u => URL.revokeObjectURL(u)); urls = []; }

function pintarCabecera(){

const ticks = m => (m.exportado && !m.meta) ? `<span class="ok">${ic('doble')}</span>` : ic('check');
const horaHTML = m => `<span class="hora">${m.destacado?`<span class="st">${ic('estrella')}</span>`:''}${m.editado?'Editado ':''}${hora(m.fecha)} ${ticks(m)}</span>`;

function citaHTML(r){
  const o = MSGS.find(x => x.id === r.id);
  const mini = o && o.thumb ? `<img src="${url(o.thumb)}" alt="">` : '';
  return `<div class="cita" data-cita="${esc(r.id)}"><div><b>Tú</b><span>${esc(resumen(o || r))}</span></div>${mini}</div>`;
}
function burbuja(m, cont){
  const h = horaHTML(m), cl = 'b' + (cont?' cont':'') + (selec.has(m.id)?' sel':'');
  const pre = (m.reenviado?`<div class="reenv">${ic('reenviar')}Reenviado</div>`:'') + (m.resp?citaHTML(m.resp):'');
  if (m.tipo==='texto') return `<div class="${cl}" data-id="${m.id}">${pre}<span class="t">${esc(m.texto)}</span>${h}</div>`;
  if (m.tipo==='foto' || m.tipo==='video'){
    const med = m.tipo==='foto'
      ? (m.thumb?`<img class="img" src="${url(m.thumb)}" alt="">`:`<div class="img" style="display:grid;place-items:center;color:var(--muted)">${ic('imagen')}</div>`)
      : `<video class="img" src="${url(m.blob)}#t=0.3" preload="metadata" muted playsinline></video><div class="play"><span><svg class="i" viewBox="0 0 24 24">${IC.play}</svg></span></div>`;
    return `<div class="${cl} media" data-id="${m.id}">${pre}<div class="marco">${med}${m.texto?'':h}</div>${m.texto?`<div class="pie"><span class="t">${esc(m.texto)}</span>${h}</div>`:''}</div>`;
  }
  if (m.tipo==='audio') return `<div class="${cl}" data-id="${m.id}">${pre}<div class="aud"><button class="pb" data-play="${m.id}"><svg class="i" viewBox="0 0 24 24">${IC.play}</svg></button><div class="barra"><i></i><b></b></div><div class="mic">${ic('mic')}</div></div><div class="aud-pie"><span class="dur">${mmss(m.dur)}</span>${h}</div></div>`;
  return '';
}
async function pintarMensajes(alFinal){
  soltarUrls();
  MSGS = (await msgsDe(abierta)).sort((a,b) => a.fecha.localeCompare(b.fecha));
  const c = $('#mensajes'), arriba = c.scrollTop; let html = '', dia = '', prev = null;
  if (!MSGS.length) html = `<div class="vacioChat">Manda aquí fotos, audios y notas de ${esc(AREAS[abierta].nombre)}. Todo queda guardado en este teléfono, aunque no haya señal.</div>`;
  for (const m of MSGS){
    const d = new Date(m.fecha).toDateString();
    if (d !== dia){ html += `<div class="dia">${diaTxt(m.fecha)}</div>`; dia = d; prev = null; }
    const cont = prev && (new Date(m.fecha) - new Date(prev.fecha) < 120000);
    html += burbuja(m, cont); prev = m;
  }
  c.innerHTML = html;
  c.querySelectorAll('.b').forEach(conectarBurbuja);
  if (alFinal) requestAnimationFrame(() => c.scrollTop = c.scrollHeight); else c.scrollTop = arriba;
}
function conectarBurbuja(el){
  const m = MSGS.find(x => x.id === el.dataset.id); if (!m) return;
  let t = null, largo = false, desliza = false, activo = false, x0 = 0, y0 = 0, dx = 0;
  el.addEventListener('pointerdown', e => {
    activo = true; largo = false; desliza = false; dx = 0; x0 = e.clientX; y0 = e.clientY;
    t = setTimeout(() => { if (!activo) return; largo = true; vibrar(30); alternarSel(m.id); }, 450);
  });
  el.addEventListener('pointermove', e => {
    if (!activo) return; const ax = e.clientX - x0, ay = e.clientY - y0;
    if (Math.abs(ax) + Math.abs(ay) > 10) clearTimeout(t);
    if (!selec.size && !largo && ax > 12 && Math.abs(ax) > Math.abs(ay)*1.5){ desliza = true; dx = Math.min(80, ax); el.style.transform = `translateX(${dx}px)`; }
  });
  const fin = () => {
    clearTimeout(t); activo = false;
    if (desliza){ el.style.transition = 'transform .15s'; el.style.transform = ''; setTimeout(() => el.style.transition = '', 160); if (dx >= 56){ vibrar(20); responderA(m); } }
  };
  el.addEventListener('pointerup', fin); el.addEventListener('pointercancel', fin);
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('click', e => {
    if (largo || desliza){ largo = false; desliza = false; return; }
    if (selec.size){ alternarSel(m.id); return; }
    if (e.target.closest('[data-play]')){ tocarAudio(m, el); return; }
    const q = e.target.closest('[data-cita]'); if (q){ irA(q.dataset.cita); return; }
    if (m.tipo==='foto' || m.tipo==='video') abrirVisor(m);
  });
}
function irA(id){
  const el = $('#mensajes').querySelector(`.b[data-id="${id}"]`);
  if (!el){ toast('Ese mensaje ya no está en esta área.'); return; }
  el.scrollIntoView({block:'center', behavior:'smooth'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

function pintarContexto(){
  const c = $('#contexto'), m = editando || respondiendo;
  if (!m){ c.hidden = true; return; }

  c.hidden = false;

function quitarContexto(){ respondiendo = null; editando = null; pintarContexto(); pintarAccion(); }
function responderA(m){ editando = null; respondiendo = m; pintarContexto(); pintarAccion(); texto.focus(); }

// ---------- Reproducir audios ----------
const AUD = new Audio(); let audId = null, audEl = null;
function pararAudio(){ AUD.pause(); if (audEl) pintarPlay(audEl, false); audId = null; audEl = null; }
function pintarPlay(el, on){ const b = el.querySelector('.pb svg'); if (b) b.innerHTML = on ? IC.pausa : IC.play; }
function tocarAudio(m, el){
  if (audId === m.id){ if (AUD.paused){ AUD.play(); pintarPlay(el,true); } else { AUD.pause(); pintarPlay(el,false); } return; }
  pararAudio(); audId = m.id; audEl = el;
  AUD.src = url(m.blob); AUD.play().catch(e => toast('No pude reproducir: ' + e.message)); pintarPlay(el, true);
}
AUD.ontimeupdate = () => {
  if (!audEl || !audEl.isConnected) return; const m = MSGS.find(x => x.id===audId); const d = (isFinite(AUD.duration) && AUD.duration) || (m && m.dur) || 1;
  const p = Math.min(100, AUD.currentTime/d*100); audEl.querySelector('.barra i').style.width = p+'%'; audEl.querySelector('.barra b').style.left = `calc(${p}% - 6px)`;
  audEl.querySelector('.dur').textContent = mmss(AUD.currentTime);
};
AUD.onended = () => { if (!audEl) return; const m = MSGS.find(x => x.id===audId); if (audEl.isConnected){ audEl.querySelector('.barra i').style.width='0'; audEl.querySelector('.barra b').style.left='-6px'; audEl.querySelector('.dur').textContent = mmss(m&&m.dur); pintarPlay(audEl,false); } audId=null; audEl=null; };

// ---------- Agregar mensajes ----------
const nuevoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
async function agregar(area, tipo, datos){
  const m = {id:nuevoId(), area, tipo, fecha:new Date().toISOString(), exportado:false, ...datos};
  if (respondiendo && abierta === area){ m.resp = {id:respondiendo.id, tipo:respondiendo.tipo, texto:respondiendo.texto||null, dur:respondiendo.dur||null}; respondiendo = null; pintarContexto(); }
  await msgPut(m);
  const r = RES[area]; r.n++; r.nuevos++; r.ultimo = {tipo, texto:m.texto, dur:m.dur, fecha:m.fecha};
  if (abierta === area){ pintarCabecera(); await pintarMensajes(true); }
  return m;
}
async function miniatura(blob, max=520){
  try {
    const bm = await createImageBitmap(blob);
    const s = Math.min(1, max/Math.max(bm.width, bm.height));
    const c = document.createElement('canvas'); c.width = Math.round(bm.width*s); c.height = Math.round(bm.height*s);
    c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height); if (bm.close) bm.close();
    return await new Promise(ok => c.toBlob(ok, 'image/jpeg', .74));
  } catch(e){ return null; }
}
async function agregarArchivos(files){
  const area = abierta; files = [...files]; if (!files.length) return;
  // Si hay texto escrito, va como comentario de la primera foto (como en WhatsApp)
  let pie = texto.value.trim(); if (pie && !editando){ texto.value = ''; ajustarTexto(); } else pie = '';
  let i = 0;
  for (const f of files){
    i++; if (files.length > 1) toast(`Guardando ${i} de ${files.length}…`, 0);
    const tipo = f.type.startsWith('video') ? 'video' : f.type.startsWith('audio') || /\.(ogg|opus|m4a|mp3|aac|amr|wav)$/i.test(f.name) ? 'audio' : 'foto';
    const d = {blob:f, nombre:f.name, tomada:f.lastModified ? new Date(f.lastModified).toISOString() : null};
    if (tipo==='foto') d.thumb = await miniatura(f);
    if (tipo==='audio') d.dur = await duracion(f);
    if (pie && tipo!=='audio'){ d.texto = pie; pie = ''; }
    await agregar(area, tipo, d);
  }
  toast(files.length > 1 ? `${files.length} archivos guardados.` : 'Guardado.');
}
function duracion(blob){ return new Promise(ok => { const a = new Audio(); const u = URL.createObjectURL(blob); a.preload='metadata'; a.onloadedmetadata = () => { URL.revokeObjectURL(u); ok(isFinite(a.duration)?a.duration:0); }; a.onerror = () => { URL.revokeObjectURL(u); ok(0); }; a.src = u; }); }

// ---------- Grabar audio ----------
let rec = null, recStream = null, recTrozos = [], recIni = 0, recReloj = null, recCancelar = false, recArea = null;
async function iniciarGrab(){
  if (!navigator.mediaDevices || !window.MediaRecorder){ toast('Este navegador no deja grabar. Usa Chrome.'); return; }
  try { recStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); }
  catch(e){ toast('No tengo permiso del micrófono. Actívalo en los permisos del sitio.', 4000); return; }
  const tipo = ['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  rec = new MediaRecorder(recStream, tipo ? {mimeType:tipo} : {}); recTrozos = []; recCancelar = false; recArea = abierta;
  rec.ondataavailable = e => { if (e.data.size) recTrozos.push(e.data); };
  rec.onstop = async () => {
    recStream.getTracks().forEach(t => t.stop()); clearInterval(recReloj);
    const dur = (Date.now() - recIni)/1000, mime = rec.mimeType || tipo || 'audio/webm', area = recArea;
    rec = null; modoGrab(false);
    if (recCancelar || dur < 0.7) return;
    const ext = mime.includes('mp4') ? 'm4a' : mime.includes('ogg') ? 'ogg' : 'webm';
    await agregar(area, 'audio', {blob:new Blob(recTrozos, {type:mime}), dur, nombre:'audio.'+ext});
  };
  rec.start(500); recIni = Date.now(); modoGrab(true); vibrar(25);
  recReloj = setInterval(() => $('#recTiempo').textContent = mmss((Date.now()-recIni)/1000), 250);
}
function terminarGrab(){ if (rec && rec.state !== 'inactive') rec.stop(); }
function descartarGrab(){ recCancelar = true; terminarGrab(); }
function modoGrab(on){ $('#caja').hidden = on; $('#grabando').hidden = !on; $('#recTiempo').textContent = '0:00'; pintarAccion(); }

const CRC = (() => { const t = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i=0;i<u8.length;i++) c = CRC[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
async function hacerZip(entradas, avance){
  const partes = [], central = [], enc = new TextEncoder(), f = new Date();
  const dt = (f.getHours()<<11)|(f.getMinutes()<<5)|(f.getSeconds()>>1), dd = ((f.getFullYear()-1980)<<9)|((f.getMonth()+1)<<5)|f.getDate();
  let off = 0;
  for (let i=0;i<entradas.length;i++){
    const e = entradas[i]; if (avance) avance(i+1, entradas.length);
    const data = new Uint8Array(await e.blob.arrayBuffer()), crc = crc32(data), n = enc.encode(e.nombre), sz = data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,dt,true); h.setUint16(12,dd,true); h.setUint32(14,crc,true); h.setUint32(18,sz,true); h.setUint32(22,sz,true);
    h.setUint16(26,n.length,true); h.setUint16(28,0,true);
    partes.push(h.buffer, n, e.blob);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,dt,true); c.setUint16(14,dd,true); c.setUint32(16,crc,true); c.setUint32(20,sz,true); c.setUint32(24,sz,true);
    c.setUint16(28,n.length,true); c.setUint32(42,off,true);
    central.push(c.buffer, n);
    off += 30 + n.length + sz;
  }
  let cd = 0; for (const p of central) cd += p.byteLength;
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,entradas.length,true); end.setUint16(10,entradas.length,true); end.setUint32(12,cd,true); end.setUint32(16,off,true);
  return new Blob([...partes, ...central, end.buffer], {type:'application/zip'});
}
const sello = d => { const f = new Date(d), p = n => String(n).padStart(2,'0'); return `${f.getFullYear()}-${p(f.getMonth()+1)}-${p(f.getDate())} ${p(f.getHours())}-${p(f.getMinutes())}-${p(f.getSeconds())}`; };
function extension(m){
  const n = (m.nombre||'').match(/\.([a-z0-9]{2,5})$/i); if (n) return n[1].toLowerCase();
  const t = (m.blob && m.blob.type) || '';
  return t.includes('jpeg')?'jpg':t.includes('png')?'png':t.includes('mp4')?(m.tipo==='audio'?'m4a':'mp4'):t.includes('webm')?'webm':t.includes('ogg')?'ogg':'bin';
}
async function exportar(todo){
  cerrarHoja();
  const lista = (await msgsTodos()).filter(m => todo || pendiente(m)).sort((a,b) => a.fecha.localeCompare(b.fecha));
  const borrados = (await kvGet('borrados')) || [];
  if (!lista.length && !borrados.length){ toast('No hay nada nuevo por enviar.'); return; }
  const entradas = [], mensajes = [];
  const grandes = lista.filter(m => m.tipo === 'foto' && (todo || !m.exportado) && ((m.blob && m.blob.size > 700*1024) || (m.original && m.original.size > 700*1024)));
  for (let i = 0; i < grandes.length; i++){ toast(`Comprimiendo fotos: ${i + 1} de ${grandes.length}…`, 0); await comprimirMsg(grandes[i]); }
  for (const m of lista){
    const a = AREAS[m.area]; if (!a) continue;
    const reg = {id:m.id, area:m.area, carpeta:a.carpeta, tipo:m.tipo, fecha:m.fecha, texto:m.texto||null, dur:m.dur||null, tomada:m.tomada||null, original:m.nombre||null,
      destacado:!!m.destacado, editado:!!m.editado, reenviado:!!m.reenviado, editada:!!m.editada, responde_a:m.resp ? m.resp.id : null, archivo:null};
    if (m.blob){
      reg.archivo = `areas/${a.carpeta}/${sello(m.fecha)} ${m.tipo} ${m.id.slice(-4)}.${extension(m)}`;
      if (todo || !m.exportado) entradas.push({nombre:reg.archivo, blob:m.blob});   // lo ya enviado solo manda su cambio, no el archivo otra vez
    }
    if (m.original){   // foto con dibujos: también va la original, sin tocar
      const e0 = ((m.original.name||'').match(/\.([a-z0-9]{2,5})$/i) || [0,'jpg'])[1].toLowerCase();
      reg.original_archivo = `areas/${a.carpeta}/originales/${sello(m.fecha)} ${m.tipo} ${m.id.slice(-4)} original.${e0}`;
      if (todo || !m.exportado) entradas.push({nombre:reg.original_archivo, blob:m.original});
    }
    mensajes.push(reg);
  }
  const json = {origen:'telefono', titulo:P.titulo, exportado:new Date().toISOString(), estados:ESTADOS, borrados,
    plan_hechos: P.plan ? {version: P.plan.version, ids: (await kvGet('planHechos')) || {}} : null,
    areas:Object.fromEntries(Object.values(AREAS).map(a => [a.id, {nivel:NIVELES[a.nivel], nombre:a.nombre, carpeta:a.carpeta}])), mensajes};
  entradas.push({nombre:'recorrido-telefono.json', blob:new Blob([JSON.stringify(json, null, 2)], {type:'application/json'})});
  let zip;
  try { zip = await hacerZip(entradas, (i,n) => toast(`Armando el zip: ${i} de ${n}…`, 0)); }
  catch(e){ toast('No pude armar el zip: ' + e.message, 5000); return; }
  const nombreZip = `recorrido ${(P.titulo||'').trim()} ${sello(new Date())}.zip`.replace(/\s+/g,' ');
  const file = new File([zip], nombreZip, {type:'application/zip'});
  const mb = (zip.size/1048576).toFixed(1);
  $('#toast').hidden = true;
  const marcar = async () => { for (const m of lista){ m.exportado = true; m.meta = false; await msgPut(m); } await kvSet('borrados', []); await recalcular(); if (abierta) await pintarMensajes(false); else pintarInicio(); };
  const puedeCompartir = navigator.canShare && navigator.canShare({files:[file]});
  hoja(`<h3>Zip listo · ${mb} MB</h3><p>${lista.length} mensaje(s). Pásalo a la PC y dile a Claude "importa el recorrido del teléfono".</p>
    ${puedeCompartir?`<button class="op" data-a="comp">${ic('subir')}<div>Compartir<small>WhatsApp, Drive, correo…</small></div></button>`:''}
    <button class="op" data-a="desc">${ic('bajar')}<div>Guardar en Descargas<small>Lo pasas luego por cable o Drive</small></div></button>`, h => {
    const c = h.querySelector('[data-a=comp]');
    if (c) c.onclick = async () => { try { await navigator.share({files:[file], title:nombreZip}); cerrarHoja(); await marcar(); toast('Enviado. Los mensajes quedan con ✓✓ azul.'); } catch(e){ if (e.name!=='AbortError') toast('No se pudo compartir: ' + e.message, 4000); } };
    h.querySelector('[data-a=desc]').onclick = async () => {
      const u = URL.createObjectURL(file), a = document.createElement('a'); a.href = u; a.download = nombreZip; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 60000); cerrarHoja(); await marcar(); toast('Guardado en Descargas.');
    };
  });
}

// ---------- Cámara: varias fotos seguidas, como WhatsApp ----------
let saltarPop = false;                      // cerrar una pantalla por código sin que el "atrás" haga más cosas
let camStream = null, camFotos = [], camFrente = false;
async function prenderCam(){
  apagarCam();
  camStream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode: camFrente ? 'user' : {ideal:'environment'}, width:{ideal:3840}, height:{ideal:2160}}});
  const v = $('#camVideo'); v.srcObject = camStream; v.style.transform = camFrente ? 'scaleX(-1)' : '';
  try { await v.play(); } catch(e){}
}
function apagarCam(){ if (camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; } $('#camVideo').srcObject = null; }
async function abrirCamara(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ $('#inCam').click(); return; }
  camFotos = [];
  try { await prenderCam(); }
  catch(e){ toast('No pude abrir la cámara aquí: uso la del teléfono.', 3000); $('#inCam').click(); return; }
  history.pushState({v:'camara'}, ''); $('#camara').hidden = false; pintarCamUltima();
}
function cerrarCamara(){ apagarCam(); camFotos = []; $('#camara').hidden = true; pintarCamUltima(); }
function pintarCamUltima(){
  const b = $('#camUltima'), n = camFotos.length;
  if (b.dataset.url) URL.revokeObjectURL(b.dataset.url);
  b.dataset.url = '';
  b.style.visibility = n ? '' : 'hidden'; $('#camListo').style.visibility = n ? '' : 'hidden';
  if (!n){ b.innerHTML = ''; return; }
  const u = URL.createObjectURL(camFotos[n-1]); b.dataset.url = u;
  b.innerHTML = `<img src="${u}" alt=""><span>${n}</span>`;
}
$('#disparo').onclick = async () => {
  const v = $('#camVideo'); if (!camStream || !v.videoWidth) return;
  const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  const fl = $('#camFlash'); fl.style.transition = 'none'; fl.style.opacity = '.75';
  requestAnimationFrame(() => requestAnimationFrame(() => { fl.style.transition = 'opacity .35s'; fl.style.opacity = '0'; }));
  vibrar(15);
  const b = await new Promise(ok => c.toBlob(ok, 'image/jpeg', .92));
  camFotos.push(new File([b], `foto ${sello(new Date())} ${camFotos.length+1}.jpg`, {type:'image/jpeg', lastModified:Date.now()}));
  pintarCamUltima();

function camListo(){

  ['Medir','#5856d6'],['Retocar pintura','#ff9500'],['Cambiar','#ff3b30'],['Limpiar','#8e8e93'],['Listo','#34c759'],['OK','#34c759']];

const ED = {items:[], i:0, lapiz:false, color:'#ff3b30', sel:null};
const LZ = {w:1, h:1};
const itemEd = () => ED.items[ED.i];
const esVideoArch = f => (f.type||'').startsWith('video') || /\.(mp4|mov|webm|3gp|mkv)$/i.test(f.name||'');

  $('#editor').hidden = false; pintarEditor();

// Lápiz: los trazos se guardan en proporción a la foto (0 a 1), así salen igual en la foto final.
function trazar(g, W, H, trazos){
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (const t of trazos){
    g.strokeStyle = t.c; g.lineWidth = t.w*W; g.beginPath();
    t.pts.forEach(([x,y], i) => i ? g.lineTo(x*W, y*H) : g.moveTo(x*W, y*H));
    if (t.pts.length === 1) g.lineTo(t.pts[0][0]*W + 0.5, t.pts[0][1]*H);
    g.stroke();
  }
}
function dibujarTrazos(){ const cv = $('#trazos'), g = cv.getContext('2d'), it = itemEd(); g.clearRect(0, 0, cv.width, cv.height); if (it) trazar(g, cv.width, cv.height, it.trazos); }
let trazoAct = null;
const normEd = e => { const r = $('#lienzoEd').getBoundingClientRect(); return [(e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height]; };
$('#trazos').addEventListener('pointerdown', e => {
  if (!ED.lapiz) return; $('#trazos').setPointerCapture(e.pointerId);
  trazoAct = {c:ED.color, w:0.009, pts:[normEd(e)]}; itemEd().trazos.push(trazoAct); dibujarTrazos();
});
$('#trazos').addEventListener('pointermove', e => { if (!trazoAct) return; trazoAct.pts.push(normEd(e)); dibujarTrazos(); });
const finTrazo = () => { if (!trazoAct) return; trazoAct = null; herramientas(); pintarMiniaturas(); };
$('#trazos').addEventListener('pointerup', finTrazo); $('#trazos').addEventListener('pointercancel', finTrazo);

// Texto, etiquetas y stickers: capas que se mueven con un dedo y se agrandan/giran con dos.
function estiloCapa(el, c){
  el.style.fontSize = (c.s*LZ.w) + 'px';
  el.style.transform = `translate(${c.x*LZ.w}px, ${c.y*LZ.h}px) translate(-50%,-50%) rotate(${c.r}rad)`;
  if (c.tipo === 'etiqueta'){ el.style.background = c.bg; el.style.color = '#fff'; }
  else if (c.tipo === 'texto') el.style.color = c.color;
}
function pintarCapas(){

const GEST = {ptrs:new Map(), capa:null, base:null, movio:false, t0:0, eraSel:false};
const dist = (a, b) => Math.hypot(a.x-b.x, a.y-b.y), ang = (a, b) => Math.atan2(b.y-a.y, b.x-a.x);
const medio = p => ({x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2});
const fotoGest = () => { const c = ED.sel; return {p:[...GEST.ptrs.values()].map(q => ({...q})), x:c&&c.x, y:c&&c.y, s:c&&c.s, r:c&&c.r}; };
const escena = $('#escena');
escena.addEventListener('pointerdown', e => {
  const it = itemEd(); if (!it || ED.lapiz || it.video || e.target.closest('.x')) return;
  escena.setPointerCapture(e.pointerId);
  GEST.ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (GEST.ptrs.size === 1){
    GEST.movio = false; GEST.t0 = Date.now();
    const el = e.target.closest('.capa');
    if (el){ const c = it.capas[+el.dataset.i]; GEST.eraSel = ED.sel === c; ED.sel = c; GEST.capa = c; marcarSel(); }
    else { GEST.capa = null; if (ED.sel){ ED.sel = null; marcarSel(); } }
  }
  GEST.base = fotoGest();
});
escena.addEventListener('pointermove', e => {
  if (!GEST.ptrs.has(e.pointerId)) return;
  GEST.ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const c = ED.sel, b = GEST.base; if (!c || !b) return;
  const p = [...GEST.ptrs.values()];
  if (p.length === 1 && GEST.capa){
    const dx = p[0].x - b.p[0].x, dy = p[0].y - b.p[0].y; if (Math.abs(dx) + Math.abs(dy) > 5) GEST.movio = true;
    c.x = Math.min(1, Math.max(0, b.x + dx/LZ.w)); c.y = Math.min(1, Math.max(0, b.y + dy/LZ.h));
  } else if (p.length >= 2 && b.p.length >= 2){
    c.s = Math.max(0.02, Math.min(0.7, b.s * dist(p[0], p[1]) / Math.max(1, dist(b.p[0], b.p[1]))));
    c.r = b.r + ang(p[0], p[1]) - ang(b.p[0], b.p[1]);
    const m0 = medio(b.p), m1 = medio(p); c.x = b.x + (m1.x-m0.x)/LZ.w; c.y = b.y + (m1.y-m0.y)/LZ.h; GEST.movio = true;
  }
  moverCapa(c);
});
const finGest = e => {
  if (!GEST.ptrs.has(e.pointerId)) return;
  GEST.ptrs.delete(e.pointerId);
  if (!GEST.ptrs.size){
    const c = GEST.capa;
    if (c && !GEST.movio && GEST.eraSel && Date.now() - GEST.t0 < 400 && c.tipo !== 'sticker') abrirEscribir(c);   // tocar de nuevo = editar
    GEST.capa = null;
  }
  GEST.base = fotoGest();
};

// Foto final: la original + trazos + capas, en una sola imagen (máx. 2560 px de lado).
function redondeado(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r); g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath(); }
function capaEnLienzo(g, W, H, c){
  const fs = c.s*W, lineas = c.txt.split('\n'), lh = fs*1.15, alto = lh*lineas.length;
  g.save(); g.translate(c.x*W, c.y*H); g.rotate(c.r);
  g.font = `800 ${fs}px ${FUENTE}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (c.tipo === 'etiqueta'){
    const w = Math.max(...lineas.map(l => g.measureText(l).width)) + fs*1.2, h = alto + fs*0.5;
    g.fillStyle = c.bg; redondeado(g, -w/2, -h/2, w, h, fs*0.5); g.fill(); g.fillStyle = '#fff';
  } else {
    g.fillStyle = c.color || '#fff';
    if (c.tipo === 'texto'){ g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = fs*0.12; }
  }
  lineas.forEach((l, i) => g.fillText(l, 0, -alto/2 + lh*(i + .5)));
  g.restore();
}
async function componer(it){
  const bm = await createImageBitmap(it.file);
  const k = Math.min(1, 2560/Math.max(bm.width, bm.height)), W = Math.round(bm.width*k), H = Math.round(bm.height*k);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
  g.drawImage(bm, 0, 0, W, H); if (bm.close) bm.close();
  trazar(g, W, H, it.trazos);
  for (const c of it.capas) capaEnLienzo(g, W, H, c);
  return await new Promise(ok => cv.toBlob(ok, 'image/jpeg', .9));
}

// ---------- Compresor de fotos (como WhatsApp: lado mayor 2048 px, JPEG 82 %) ----------
async function comprimir(blob, nombre = 'foto.jpg', lado = 2048, q = .82){
  try {
    if (!blob || blob.size < 500*1024) return {blob, nombre};
    if (blob.type && !/^image\/(jpeg|png|webp|heic|heif)/.test(blob.type)) return {blob, nombre};
    const bm = await createImageBitmap(blob); const k = Math.min(1, lado/Math.max(bm.width, bm.height));
    const c = document.createElement('canvas'); c.width = Math.round(bm.width*k); c.height = Math.round(bm.height*k);
    c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height); if (bm.close) bm.close();
    const b = await new Promise(ok => c.toBlob(ok, 'image/jpeg', q));
    if (!b || b.size >= blob.size) return {blob, nombre};
    return {blob: b, nombre: (nombre || 'foto').replace(/\.[^.]*$/, '') + '.jpg'};
  } catch(e){ return {blob, nombre}; }
}
// Comprime en el teléfono una foto ya guardada (y su original sin dibujos), y la deja así para liberar espacio.
async function comprimirMsg(m){
  if (m.tipo !== 'foto') return false;
  let cambio = false;
  if (m.blob && m.blob.size > 700*1024){ const c = await comprimir(m.blob, m.nombre); if (c.blob !== m.blob){ m.blob = c.blob; m.nombre = c.nombre; cambio = true; } }
  if (m.original && m.original.size > 700*1024){ const c = await comprimir(m.original, m.original.name || 'original.jpg'); if (c.blob !== m.original){ m.original = new File([c.blob], c.nombre, {type:'image/jpeg'}); cambio = true; } }
  if (cambio) await msgPut(m);
  return cambio;
}
async function comprimirTodas(){
  cerrarHoja();
  const fotos = (await msgsTodos()).filter(m => m.tipo === 'foto' && ((m.blob && m.blob.size > 700*1024) || (m.original && m.original.size > 700*1024)));
  if (!fotos.length){ toast('Las fotos ya están comprimidas.'); return; }
  let antes = 0, despues = 0, i = 0;
  for (const m of fotos){
    toast(`Comprimiendo fotos: ${++i} de ${fotos.length}…`, 0);
    antes += (m.blob ? m.blob.size : 0) + (m.original ? m.original.size : 0);
    await comprimirMsg(m);
    despues += (m.blob ? m.blob.size : 0) + (m.original ? m.original.size : 0);
  }
  toast(`Listo: ${fotos.length} fotos, de ${(antes/1048576).toFixed(0)} MB a ${(despues/1048576).toFixed(0)} MB.`, 5000);
}

  const det = (k, abrir, resumen, cuerpo, extraCls = '') => `<details class="blq${extraCls}" data-k="${k}"${(abiertos ? abiertos.has(k) : abrir) ? ' open' : ''}>${resumen}${cuerpo}</details>`;

    <div class="sub">${hechas} de ${n} hechas · emitido ${fdia(pl.emitido)}</div></div>`;
  if (pl.preguntas.length || pl.avisos.length)
    h += det('preg', false, sum(`Preguntas y avisos (${pl.preguntas.length + pl.avisos.length})`, 'Revísalos antes de repartir las listas', '<span class="pd alta"></span>'),
      `<div class="pbody">${pl.preguntas.map(q => `<p><b>${esc(q.para)}:</b> ${esc(q.texto)}</p>`).join('')}${pl.avisos.map(x => `<p class="aviso">${esc(x)}</p>`).join('')}${pl.resumen ? `<p class="res">${esc(pl.resumen)}</p>` : ''}</div>`);

  if (planVista === 'dia'){
    let abrir = pl.dias.indexOf(hoy); if (abrir < 0 && hoy < pl.dias[0]) abrir = 0;
    pl.dias.forEach((d, i) => {

      const mias = actsDe(per.id); if (!mias.length) continue;
      const hh = mias.filter(a => HECHOS[a.id]).length;
      h += det(`p:${per.id}`, false, sum(esc(per.nombre), `${esc(per.oficio)} · ${mias.length} act. · ${hh} hechas · ${fdia(pl.dias[mias[0].d0])} → ${fdia(pl.dias[Math.max(...mias.map(a => a.d1))])}`, puntos(mias)),
        `<button class="btnWa" data-per="${esc(per.id)}">${ic('enviar')} Enviar su lista por WhatsApp</button>` + mias.map(a => actHTML(a, false, actsAb)).join(''));
    }
    const sin = acts.filter(a => !a.responsable);
    if (sin.length) h += det('p:-', false, sum('Por asignar', `${sin.length} actividades sin responsable`, puntos(sin)), sin.map(a => actHTML(a, false, actsAb)).join(''));
  } else {
    for (const nv of [...P.niveles.map(x => x.id), 'gen']){
      const ars = Object.values(AREAS).filter(a => a.nivel === nv).map(a => [a, acts.filter(x => x.area === a.id)]).filter(([, l]) => l.length);
      if (!ars.length) continue;
      h += `<div class="seccion">${esc(NIVELES[nv])}</div>`;
      for (const [ar, l] of ars) h += det(`a:${ar.id}`, false, sum(esc(ar.nombre), `${l.length} actividades · ${l.filter(a => HECHOS[a.id]).length} hechas`, puntos(l)), l.map(a => actHTML(a, true, actsAb)).join(''));
    }
  }
  L.innerHTML = h;
  L.querySelectorAll('.segm button').forEach(b => b.onclick = () => { planVista = b.dataset.v; pintarPlan(); });
  if (conservar) sc.scrollTop = y;
}

$('#lista').addEventListener('click', async e => {
  if (tab !== 'plan') return;
  const act = e.target.closest('.pact');
  if (e.target.closest('.chk') && act){
    const id = act.dataset.id; if (HECHOS[id]) delete HECHOS[id]; else HECHOS[id] = new Date().toISOString();
    await kvSet('planHechos', HECHOS); vibrar(15); pintarPlan(true); return;
  }
  const img = e.target.closest('img[data-msg]');
  if (img){ const m = await req(st('msgs').get(img.dataset.msg)); if (m) abrirVisor(m); return; }
  const wa = e.target.closest('.btnWa'); if (wa){ enviarLista(wa.dataset.per); return; }
  if (act) act.classList.toggle('abierta');
});

// Manda la lista pendiente de una persona: texto + fotos, con el menú de compartir del teléfono (elige WhatsApp).
async function enviarLista(pid){
  const per = P.plan.personas.find(x => x.id === pid), pend = actsDe(pid).filter(a => !HECHOS[a.id]);
  if (!pend.length){ toast(`${per.nombre} ya tiene todo hecho.`); return; }
  const txt = [`Hola ${per.nombre.split(' ')[0]}, te paso tu lista del plan de culminación de la obra ${P.titulo}.`,
    `Son ${pend.length} actividad${pend.length !== 1 ? 'es' : ''}:`, '',
    ...pend.map((a, i) => `${i + 1}. ${AREAS[a.area] ? AREAS[a.area].nombre + ': ' : ''}${a.titulo} (${a.rango})${a.prioridad === 'alta' ? ' ⚠ prioridad' : ''}`),
    '', 'Te mando las fotos de cada punto. Cuando termines cada una, mándame una foto. Cualquier duda me escribes.'].join('\n');
  const files = [];
  for (const a of pend) for (const f of a.fotos || []){ const m = planFotos[f.cod]; if (m && files.length < 10) files.push(new File([m.blob], `${a.id} ${f.cod}.jpg`, {type: m.blob.type || 'image/jpeg'})); }
  try {
    if (files.length && navigator.canShare && navigator.canShare({files, text: txt})){ await navigator.share({files, text: txt}); return; }
    if (navigator.share){ await navigator.share({text: txt}); return; }
  } catch(e){ if (e.name === 'AbortError') return; }
  location.href = `https://wa.me/${per.telefono || ''}?text=${encodeURIComponent(txt)}`;
}
